  { family:"晋家", name:"晋武公", title:"晋武公(曲沃代翼)",start:-716, end:-677, influence:40,
    bio:"晋武公（？–前677），名称，姬姓，唐叔虞之后，与周王室同宗别支。原为曲沃一支——曲沃武公经过三代人近七十年的努力，在前679年终于灭晋侯缗统一晋国。贿赂周厘王获得正式册命——「曲沃代翼」是春秋时期小宗灭大宗的标志性事件。在位三十九年，晋国统一后迅速崛起。" },
  { family:"晋家", name:"晋献公", title:"晋献公(并国十七服国三十八)",start:-676, end:-651, influence:55,
    bio:"晋献公（？–前651），名诡诸，晋武公之子。即位后大肆扩张——「并国十七，服国三十八」，灭耿、霍、魏、虞、虢等国。著名的「假途灭虢」即发生在此时。但晚年宠幸骊姬——废太子申生立奚齐，引发「骊姬之乱」。申生自杀、重耳和夷吾流亡国外。前651年去世后晋国陷入内乱。" },
  { family:"晋家", name:"晋惠公", title:"晋惠公",         start:-650, end:-637, influence:25,
    bio:"晋惠公（？–前637），名夷吾，晋献公之子。在秦穆公的帮助下回国即位，但即位后背弃了对秦国的承诺——不给秦国河西五城。前645年秦晋韩原之战——晋军大败，晋惠公被俘。秦穆公在其姐姐（惠公之姊穆姬）的求情下释放了他。在位十四年政治反复无常——「背秦之施」成为其最大污点。" },
  { family:"晋家", name:"晋文公", title:"晋文公(城濮之战称霸)",start:-636, end:-628, influence:75,
    bio:"晋文公（前697–前628），名重耳，晋献公之子。流亡列国十九年——历经狄、卫、齐、曹、宋、郑、楚、秦诸国，备尝艰辛。前636年在秦穆公帮助下归国即位。对内整顿内政任用狐偃赵衰等贤臣，对外「尊王攘夷」——平定王子带之乱迎周襄王复位。前632年城濮之战大败楚军——退避三舍的典故即出于此。战后在践土之盟被周天子册命为侯伯——成为春秋五霸之一。惜在位仅八年便去世，霸业短暂而辉煌。" },
  { family:"晋家", name:"晋襄公", title:"晋襄公",         start:-627, end:-621, influence:45,
    bio:"晋襄公（？–前621），名欢，晋文公之子。即位后延续父亲的霸业。前627年秦穆公趁晋丧偷袭郑国——晋襄公在崤山设伏大败秦军，俘虏秦军三名主帅孟明视西乞术白乙丙，史称「崤之战」。此后多次击败秦军，巩固了晋国在中原的霸主地位。但他在位仅七年便病逝——晋国霸业从巅峰开始出现裂痕。" },
  { family:"晋家", name:"晋灵公", title:"晋灵公",         start:-620, end:-607, influence:20,
    bio:"晋灵公（？–前607），名夷皋，晋襄公之子。即位时尚年幼，赵盾以正卿身份执掌朝政。长大后荒淫暴虐——「从台上弹人观其避丸」、因为熊掌没炖烂便杀了厨师。赵盾多次劝谏无效。前607年被赵盾族弟赵穿杀死于桃园——董狐在史书上写「赵盾弑其君」。「董狐直笔」成为中国直书不隐的史学典范。" },
  { family:"晋家", name:"晋成公", title:"晋成公",         start:-606, end:-600, influence:15,
    bio:"晋成公（？–前600），名黑臀，晋文公之子、晋襄公之弟。赵盾在弑灵公后迎立他为君。在位七年。此期楚国在楚庄王治下日益强大——前606年楚庄王「问鼎中原」。晋国虽维持霸主名号但已面临楚国的强力挑战。前600年病逝。" },
  { family:"晋家", name:"晋景公", title:"晋景公(鞌之战)", start:-599, end:-581, influence:30,
    bio:"晋景公（？–前581），名据，晋成公之子。在位十九年。前597年楚庄王在邲之战中大败晋军——晋国霸业遭受重创。但景公迅速恢复——前589年鞌之战中晋军大败齐军。晚年诛杀赵氏——「赵氏孤儿」的悲剧即发生在此时。前581年病逝——据说他掉入厕所溺死，是中国历史上死得最离奇的君主之一。" },
  { family:"晋家", name:"晋厉公", title:"晋厉公",         start:-580, end:-573, influence:15,
    bio:"晋厉公（？–前573），名寿曼，晋景公之子。即位后试图削弱卿族势力加强君权。前575年鄢陵之战大败楚军——楚共王被射中眼睛，是晋国对楚国的一次重大胜利。但他猜忌功臣、杀死伯宗。前573年被栾书中行偃发动政变囚杀。厉公之死表明晋国君权与卿族之争已白热化。" },
  { family:"晋家", name:"晋悼公", title:"晋悼公(复霸)",   start:-572, end:-558, influence:55,
    bio:"晋悼公（前586–前558），名周，晋襄公之曾孙。厉公被弑后从周王畿被迎回即位——年仅十四岁却展现出非凡的政治才能。整顿内政、九合诸侯、三驾胜楚——使晋国在邲之败后重新夺回中原霸权，史称「复霸」。用魏绛和戎之策稳定北方。可惜英年早逝年仅二十九岁。他的死是晋国霸业的终结——此后六卿势力不断膨胀国君大权旁落。" },
  { family:"晋家", name:"晋平公", title:"晋平公",         start:-557, end:-532, influence:25,
    bio:"晋平公（？–前532），名彪，晋悼公之子。在位二十六年。前期由荀偃士匄执政尚能维持晋国霸权。但后期昏庸奢侈——「晋平公铸大钟」、与楚国争霸日渐力不从心。前546年「弭兵之会」——晋楚平分霸权，中原进入相对和平期。但六卿势力迅速膨胀——晋国公室从此名存实亡。" },
  { family:"晋家", name:"晋昭公", title:"晋昭公",         start:-531, end:-526, influence:10,
    bio:"晋昭公（？–前526），名夷，晋平公之子。在位六年。此期六卿——韩赵魏智范中行——势力已全面超越公室。昭公平庸，对卿族专权无能为力。前526年病逝。晋国「公室卑、六卿强」的格局已不可逆转。" },
  { family:"晋家", name:"晋顷公", title:"晋顷公(六卿强)", start:-525, end:-512, influence:8,
    bio:"晋顷公（？–前512），名去疾，晋昭公之子。在位十四年。此期六卿开始互相兼并——前513年「铸刑鼎」将法律条文铸于鼎上公布，是中国历史上最早成文法的公布事件之一。顷公仅是六卿手中的傀儡。前512年病逝。" },
  { family:"晋家", name:"晋定公", title:"晋定公",         start:-511, end:-475, influence:8,
    bio:"晋定公（？–前475），名午，晋顷公之子。在位三十七年。前497年范氏中行氏与赵氏爆发内战——六卿兼并战全面打响。前493年赵简子击败范氏中行氏的联军。此期间吴王夫差北上黄池会盟争霸——定公对此无能为力。前475年去世——「史记」称他在位数十年而「政在赵氏」。" },
  { family:"晋家", name:"晋出公", title:"晋出公",         start:-474, end:-457, influence:8,
    bio:"晋出公（？–前457），名凿，晋定公之子。在位十八年。前458年智伯联合韩魏围攻赵氏晋阳——赵襄子坚守孤城。前453年韩魏临阵倒戈与赵合击智伯——「三家灭智」是晋国六卿兼并的转折点。出公试图借助齐楚力量讨伐四卿——失败后逃亡，死于途中。韩赵魏三家自此实际瓜分晋国。" },
  { family:"晋家", name:"晋哀公", title:"晋哀公",         start:-456, end:-439, influence:5,
    bio:"晋哀公（？–前439），名骄，晋出公之族。三家灭智后迎立他为君。在位十八年——完全是一个傀儡，领地仅限于绛和曲沃两座城池。韩赵魏三家对他「北面而臣之」无非是保留一个名义上的招牌。前439年去世——晋国公室的存在已无实际意义。" },
  { family:"晋家", name:"晋静公", title:"晋静公(晋祀绝)", start:-369, end:-349, influence:2,
    bio:"晋静公（？–前349），名俱酒，晋哀公之后。前403年韩赵魏被周威烈王正式册命为诸侯——晋国公室的法理地位已丧失。静公仅保有极少领地直到前369年继位。前349年韩赵魏三家彻底瓜分了晋国最后的土地——迁静公为庶人，晋国灭亡。唐叔虞以来的晋国社稷至此断绝。《史记》称：「静公迁为家人，晋绝不祀。」" },

  // ═══ 晋赵家 — 赵氏→赵国 (Zhao Clan → Zhao State) · slot 53 ═══
  { family:"晋赵家", name:"赵盾",   title:"赵盾(正卿专政)",start:-621, end:-601, influence:55,
    bio:"赵盾（？–前601），嬴姓赵氏，与秦嬴家同姓不同族，造父之后。赵衰之子，晋国正卿执掌朝政二十年。晋襄公去世后他拥立年幼的晋灵公——成为晋国第一个专权的卿族首领。晋灵公长大后荒淫暴虐试图除掉赵盾，赵盾被迫流亡——其族弟赵穿杀灵公后赵盾复出执政。董狐在史书上写「赵盾弑其君」——他虽为此辩白但终未能改写史书。在位期间压制秦国巩固晋国霸权。是赵氏家族崛起的关键人物。" },
  { family:"晋赵家", name:"赵武",   title:"赵武(执政正卿)",start:-583, end:-541, influence:40,
    bio:"赵武（前598–前541），嬴姓赵氏，赵盾之孙。「赵氏孤儿」的本尊——赵氏在晋景公时几乎被灭族，赵武作为遗腹子被程婴和公孙杵臼救下。十五年后在韩厥帮助下恢复赵氏封邑。后来成为晋国正卿——前546年主持了著名的宋国「弭兵之会」，使晋楚两大阵营达成和平协议。执政期间谦逊有礼——孔子称其「赵文子，贤大夫也」。前541年去世。" },
  { family:"晋赵家", name:"赵简子", title:"赵简子(赵鞅)",   start:-505, end:-476, influence:45,
    bio:"赵简子（？–前476），嬴姓赵氏，赵武之孙。晋国正卿——在六卿兼并战中奠定了赵氏的基础。前513年与荀寅铸刑鼎公布范宣子所定刑书——是中国最早成文法之一。前497年与范氏中行氏爆发内战——在晋阳之战中坚持到最后获胜，消灭范氏和中行氏。此后赵氏成为晋国最强大的卿族之一。临终选定庶子赵无恤（赵襄子）作为继承人——以才能而非嫡庶选人是重大突破。" },
  { family:"晋赵家", name:"赵襄子", title:"赵襄子(灭智伯分晋)",start:-475, end:-425, influence:45,
    bio:"赵襄子（？–前425），嬴姓赵氏，赵简子庶子。前453年智伯联合韩魏围攻赵氏晋阳——引汾水灌城，「城中悬釜而炊，易子而食」。赵襄子派张孟谈暗中说服韩魏反水——三家合力灭智伯，「三家分晋」格局由此确立。传说他将智伯的头颅涂上漆当作饮酒的器具。他统治赵氏五十余年——赵国疆域基本由他奠定。前425年去世。" },
  { family:"晋赵家", name:"赵烈侯", title:"赵烈侯(赵籍)",   start:-424, end:-400, influence:25,
    bio:"赵烈侯（？–前400），嬴姓赵氏，赵襄子之后。前403年被周威烈王正式册命为诸侯——赵氏正式成为赵国。在位期间任用公仲连为相进行改革——「选练举贤、任官使能」。「节财俭用、察度功德」是赵国早期的治国方针。前400年去世——赵国在战国七雄中初步站稳脚跟。" },
  { family:"晋赵家", name:"赵敬侯", title:"赵敬侯(迁都邯郸)",start:-399, end:-375, influence:10,
    bio:"赵敬侯（？–前375），嬴姓赵氏，赵烈侯之子。前386年将赵国都城从中牟迁至邯郸——邯郸从此成为赵国政治经济中心，也是战国时期最繁华的都市之一。在位期间赵国多次与魏国和齐国发生战争——赵国在战国中期尚处于防御态势。前375年去世。" },
  { family:"晋赵家", name:"赵成侯", title:"赵成侯",         start:-374, end:-350, influence:15,
    bio:"赵成侯（？–前350），嬴姓赵氏，赵敬侯之子。在位二十五年。此期魏国在魏惠王治下称雄中原——赵国在魏国的军事压力下多次失利。前353年魏国围攻赵国都城邯郸——齐国派出孙膑以「围魏救赵」之策在桂陵大败魏军。成侯与韩齐联手对抗魏国维持续战国格局的平衡。前350年去世。" },
  { family:"晋赵家", name:"赵肃侯", title:"赵肃侯",         start:-349, end:-326, influence:10,
    bio:"赵肃侯（？–前326），嬴姓赵氏，赵成侯之子。在位二十四年。此期秦国经过商鞅变法后迅速崛起——对山东六国形成巨大压力。赵肃侯修建长城防御北方游牧民族的侵袭——赵国开始面临南北双重军事压力。前326年去世——葬礼上秦楚燕齐魏「五国各出锐师万人」来参加，是大国外交的罕见场景。" },
  { family:"晋赵家", name:"赵武灵王",title:"赵武灵王(胡服骑射)",start:-325, end:-299, influence:70,
    bio:"赵武灵王（前340–前295），嬴姓赵氏，赵肃侯之子。战国最具改革魄力的君主之一。前307年不顾贵族反对推行「胡服骑射」——命令全军改穿胡人短衣骑马射箭，是中国军事史上划时代的变革。此后赵国骑兵横扫北方——灭中山国、北逐林胡楼烦、开辟云中雁门代郡三郡。但他晚年废长立幼——传位于幼子赵惠文王，自号「主父」。前295年在沙丘之变中被围困于沙丘宫活活饿死——一代雄主死于自己亲手制造的家庭悲剧。" },
  { family:"晋赵家", name:"赵惠文王",title:"赵惠文王(廉颇蔺相如)",start:-298, end:-266, influence:30,
    bio:"赵惠文王（前308–前266），嬴姓赵氏，赵武灵王次子。沙丘之变后即位。在位期间名臣辈出——廉颇、蔺相如、赵奢、平原君赵胜等。「完璧归赵」（蔺相如使秦索回和氏璧）、「将相和」（廉颇负荆请罪）、「渑池之会」等著名典故均出于此时。赵国在惠文王治下维持了战国第二强国的地位。前266年去世——赵国失去了最后一位能抗衡秦国的君主。" },
  { family:"晋赵家", name:"赵悼襄王",title:"赵悼襄王",     start:-244, end:-236, influence:20,
    bio:"赵悼襄王（？–前236），嬴姓赵氏，赵惠文王之子。兄赵孝成王在位时发生长平之战（前260年）——赵国主力被白起坑杀四十五万，元气大伤。悼襄王继位后秦国在秦昭襄王和秦王政的先后领导下加速统一进程，赵国国力已不可挽回。他废太子赵嘉立赵迁——为赵国灭亡埋下最后的祸根。前236年去世。" },
  { family:"晋赵家", name:"赵幽缪王",title:"赵幽缪王(迁)", start:-235, end:-229, influence:15,
    bio:"赵幽缪王（？–？），嬴姓赵氏，赵悼襄王之子，名迁。在位七年。听信宠臣郭开的谗言杀害了名将李牧——「李牧死，赵国亡」成为千古名言。前229年秦将王翦大举攻赵——赵幽缪王被俘至咸阳，赵国主力被消灭。前228年秦灭赵置邯郸郡——赵国作为国家终结。公子嘉北逃代地继续抵抗。" },
  { family:"晋赵家", name:"代王嘉", title:"代王嘉(赵公子嘉)",start:-228, end:-222, influence:8,
    bio:"代王嘉（？–？），嬴姓赵氏，赵悼襄王之子，赵幽缪王之兄。邯郸陷落后率残部北逃至代地自立为代王——与燕国联合继续抗秦。前227年燕太子丹派荆轲刺秦王失败。前222年秦将王贲攻取代地俘虏代王嘉——赵国最后的抵抗彻底终结。代王嘉作为赵国的末世君主只延续了六年。" },

  // ═══ 晋魏家 — 魏氏→魏国 (Wei Clan → Wei State) · slot 54 ═══
  { family:"晋魏家", name:"魏文侯", title:"魏文侯(李悝变法,三晋之首)",start:-445, end:-396, influence:65,
    bio:"魏文侯（？–前396），姬姓魏氏，毕公高之后，与明魏忠贤魏家非同一族。战国初期最伟大的君主之一。任用李悝变法——推行「尽地力之教」和平籴法使魏国成为战国首富；制定《法经》是中国第一部成文法典；用吴起练「魏武卒」——精兵五万人战无不胜。礼贤下士——拜子夏为师。魏国在他治下成为战国七雄之首。「三晋之中，魏最强」。前396年去世。" },
  { family:"晋魏家", name:"魏武侯", title:"魏武侯",         start:-395, end:-370, influence:40,
    bio:"魏武侯（？–前370），姬姓魏氏，魏文侯之子。继承父亲的霸业——但缺乏父亲的政治智慧。逼走吴起使吴起投奔楚国——魏国丧失最杰出的军事统帅。对外四面树敌——与赵韩齐秦交恶。前370年去世时因未立太子引发魏国内乱——「子罃与公中缓争立」。韩赵趁机联合伐魏——魏国几乎亡国，从此从巅峰滑落。" },
  { family:"晋魏家", name:"魏惠王", title:"魏惠王(迁都大梁)",start:-369, end:-319, influence:45,
    bio:"魏惠王（前400–前319），姬姓魏氏，魏武侯之子。名罃。在位五十一年。前344年率先称王——是战国诸侯中最早称王者之一。但他在位期间魏国经历了从盛到衰的转折：前353年桂陵之战败于齐（孙膑「围魏救赵」）、前341年马陵之战庞涓兵败自杀——魏武卒精锐尽失。面对秦国压力他被迫将都城从安邑迁至大梁（今开封）——所以魏国又称「梁国」。晚年在齐秦双面夹击下国力大衰。" },
  { family:"晋魏家", name:"魏襄王", title:"魏襄王",         start:-318, end:-296, influence:20,
    bio:"魏襄王（？–前296），姬姓魏氏，魏惠王之子。在位期间魏国在齐秦楚三大国夹缝中艰难求生。前317年公孙衍组织韩赵魏燕楚五国合纵伐秦——但联军各怀异心未能成功。此后秦国张仪的连横策略逐步瓦解合纵。襄王在位期间魏国不断割地求和——国力持续衰退。" },
  { family:"晋魏家", name:"魏昭王", title:"魏昭王",         start:-295, end:-277, influence:15,
    bio:"魏昭王（？–前277），姬姓魏氏，魏襄王之子。在位期间秦国在秦昭襄王治下加速扩张——白起率军屡次大败魏军。前293年伊阙之战——白起大破韩魏联军斩首二十四万。魏国从此一蹶不振——只能依靠向秦国割地求和维持生存。前277年去世。" },
  { family:"晋魏家", name:"魏安釐王",title:"魏安釐王(信陵君合纵)",start:-276, end:-243, influence:20,
    bio:"魏安釐王（？–前243），姬姓魏氏，魏昭王之子。在位三十四年。其异母弟信陵君魏无忌是战国四公子之一——「窃符救赵」的传奇即发生在此时。前257年信陵君窃取兵符率魏军救赵大败秦军。但安釐王猜忌信陵君——解除了他的兵权。前243年安釐王去世同年信陵君也病逝——魏国失去了最后的支柱。" },
  { family:"晋魏家", name:"魏景湣王",title:"魏景湣王",     start:-242, end:-228, influence:10,
    bio:"魏景湣王（？–前228），姬姓魏氏，魏安釐王之子。在位期间秦国统一进程加速——秦王政已开始发动灭国战争。前230年秦灭韩国。前228年秦将王翦大举伐赵灭邯郸。魏国处于秦国四面包围之中——灭亡只是时间问题。前228年去世传位于子魏王假。" },
  { family:"晋魏家", name:"魏王假", title:"魏王假",         start:-227, end:-225, influence:5,
    bio:"魏王假（？–？），姬姓魏氏，魏景湣王之子。即位第三年（前225年）秦将王贲引黄河水灌魏都大梁——城墙崩塌、军民溺死无数。魏王假出城投降——被秦军俘虏。魏国自毕万受封以来延续四百余年的社稷至此灭亡。秦王政置魏地为砀郡。魏王假的结局无确切记载——大概率被押送咸阳。" },

  // ═══ 晋韩家 — 韩氏→韩国 (Han Clan → Han State) · slot 55 ═══
  { family:"晋韩家", name:"韩景侯", title:"韩景侯(韩虔)",   start:-402, end:-375, influence:25,
    bio:"韩景侯（？–前375），姬姓韩氏，曲沃桓叔之后，与五代韩家非同一族。韩氏始祖韩万为曲沃桓叔之子封于韩原故称韩氏。韩景侯在前403年被周威烈王正式册命为诸侯——「三家分晋」完成法律程序。在位期间韩国领土夹在魏楚之间发展空间有限。前375年去世——同年韩国灭郑国迁都新郑，打开发展局面的是其子韩哀侯。" },
  { family:"晋韩家", name:"韩哀侯", title:"韩哀侯(灭郑迁都)",start:-376, end:-375, influence:10,
    bio:"韩哀侯（？–前375），姬姓韩氏，韩景侯之子。在位第二年（前375年）完成灭郑大业——郑国自郑庄公以来的三百七十年历史终结。韩国将都城从平阳迁至郑国故都新郑——新郑成为韩国的政治中心。但在位仅二年——前375年被臣下严遂和侠累（韩傀）的权力斗争波及被刺杀身亡。韩国虽灭郑但国力在七雄中仍属最弱。" },
  { family:"晋韩家", name:"韩共侯", title:"韩共侯",         start:-374, end:-363, influence:10,
    bio:"韩共侯（？–前363），姬姓韩氏，韩哀侯之后。又名韩懿侯。在位约十二年。此期间魏国在魏武侯治下仍为中原霸主——韩国夹在秦魏楚三大国之间，对外扩张空间有限。共侯只能在大国夹缝中勉强维持韩国独立。前363年去世，传位于子韩昭侯。" },
  { family:"晋韩家", name:"韩昭侯", title:"韩昭侯(申不害相韩)",start:-362, end:-333, influence:25,
    bio:"韩昭侯（？–前333），姬姓韩氏，韩共侯之子。前355年起用申不害为相改革——申不害是法家「术」派的代表人物。「内修政教、外应诸侯」——十八年间「国治兵强，无侵韩者」。韩昭侯与申不害的搭配是战国变法中唯一成功的法家「术治」范例——但依赖君主个人能力缺乏制度建设。前333年去世后韩国再次衰落。" },
  { family:"晋韩家", name:"韩襄王", title:"韩襄王",         start:-311, end:-296, influence:15,
    bio:"韩襄王（？–前296），姬姓韩氏，韩昭侯之后。即位后韩国复衰——在秦国的不断打击下屡战屡败。前307年秦武王攻取韩国宜阳——打通了东进中原的通道。韩襄王在位期间韩国被迫不断向秦国割地求和——「以地事秦，犹抱薪救火」。前296年去世。" },
  { family:"晋韩家", name:"韩釐王", title:"韩釐王",         start:-295, end:-273, influence:15,
    bio:"韩釐王（？–前273），姬姓韩氏，韩襄王之子。在位期间秦昭襄王以白起为将——前293年伊阙之战白起大败韩魏联军斩首二十四万。此战后韩国的精锐部队损失殆尽。前273年去世——韩国已是「地方不满数百里，劲卒不过数万」，在秦国面前毫无还手之力。" },
  { family:"晋韩家", name:"韩桓惠王",title:"韩桓惠王",     start:-272, end:-239, influence:10,
    bio:"韩桓惠王（？–前239），姬姓韩氏，韩釐王之子。在位期间韩国几乎沦为秦国的附庸。他试图用「疲秦之计」——派水工郑国到秦国劝说修渠以消耗秦国国力——结果郑国渠反而使关中成为沃野，秦国更强。韩国的「间谍」成了秦国的水利功臣。前239年去世——韩国灭亡已进入倒计时。" },
  { family:"晋韩家", name:"韩王安", title:"韩王安(韩亡)",   start:-238, end:-230, influence:5,
    bio:"韩王安（？–？），姬姓韩氏，韩桓惠王之子。前238年即位——此时秦国已灭嫪毐之乱秦王政亲政，统一大业全面启动。前230年秦王政派内史腾攻韩——俘虏韩王安，韩国灭亡。韩王安被迁至陈地，后因韩国旧贵族在新郑叛乱受牵连被处死。韩国是六国中被秦最先灭亡的一国。" },

  // ═══ 姜家 — 春秋齐国 (Jiang Qi) · slot 56 ═══
  { family:"姜家", name:"齐襄公", title:"齐襄公(诸儿,被弑)",start:-697, end:-686, influence:15,
    bio:"齐襄公（？–前686），姜姓吕氏，太公望之后。名诸儿。在位期间荒淫无道——与妹妹文姜私通，派杀手彭生杀害妹夫鲁桓公。政令无常、诛杀不当——朝中人人自危。前686年公孙无知（襄公堂弟）联合连称管至父发动政变——杀死齐襄公。襄公之死引发齐国君位争夺——公子小白（齐桓公）和公子纠分别从莒国和鲁国赶回争位，管仲射中小白带钩的一幕即将上演。" },
  { family:"姜家", name:"齐桓公", title:"齐桓公(九合诸侯一匡天下,管仲相)",start:-685, end:-643, influence:80,
    bio:"齐桓公（？–前643），姜姓吕氏，太公望之后。名小白。在与公子纠的继位竞争中胜出——鲍叔牙力荐管仲，桓公不计前嫌任用管仲为相。管仲推行改革——「叁其国而伍其鄙」、「相地而衰征」，齐国迅速富强。打出「尊王攘夷」旗号——北逐山戎救燕、南伐楚责问「苞茅不贡」、平定周室内乱。葵丘之盟（前651年）是霸业的顶峰——周天子亲赐胙肉。他是春秋五霸之首。但晚年不听管仲遗言重用易牙竖刁开方——前643年病重时三奸作乱，被囚禁宫中活活饿死，尸虫流出户外方被发现。" },
  { family:"姜家", name:"齐孝公", title:"齐孝公",         start:-642, end:-633, influence:10,
    bio:"齐孝公（？–前633），姜姓吕氏，齐桓公之子。桓公死后五子争立——齐国大乱。在宋襄公的援助下即位。在位期间齐国霸业已丧失——宋襄公一度试图接替桓公成为霸主。齐孝公试图恢复齐国霸权但实力不济。前633年去世。" },
  { family:"姜家", name:"齐灵公", title:"齐灵公",         start:-581, end:-554, influence:25,
    bio:"齐灵公（？–前554），姜姓吕氏，齐顷公之子。在位二十八年。前571年参与诸侯会盟。但齐灵公面临晋国的强大压力——前555年晋率诸侯伐齐，齐灵公在平阴之战中大败。此后齐国被晋国压制。晚年轻易废太子立宠妾之子——引发齐国新一轮政治危机。前554年去世。" },
  { family:"姜家", name:"齐庄公",title:"齐庄公(后庄公,崔杼弑)",start:-553, end:-548, influence:15,
    bio:"齐庄公（后）（？–前548），姜姓吕氏，名光，齐灵公之子。灵公本欲废太子光传位公子牙——崔杼在灵公去世后迎立太子光为国君。这位后庄公与崔杼之妻棠姜私通——前548年崔杼在家中设伏将其杀死。齐太史兄弟为直书「崔杼弑其君」前仆后继以身殉史——是中国史学精神的最高象征。同谥异人——姜齐有两位齐庄公：前庄公名购（前794–前731在位），后庄公名光（前553–前548在位）。两者相隔两百年非同一人。" },
  { family:"姜家", name:"齐景公", title:"齐景公(晏婴相)", start:-547, end:-490, influence:35,
    bio:"齐景公（？–前490），姜姓吕氏，齐灵公之子、后庄公之弟。在位五十八年是姜齐在位最久的君主之一。任用著名政治家晏婴为相（晏子使楚、「橘生淮南则为橘」的典故即出于此时）。景公前期齐国颇有中兴气象。但后期奢侈——「齐景公好治宫室、聚狗马」。晏婴去世后齐国问题丛生——田氏在齐国的势力日益坐大。前490年去世时田氏已实际掌控齐国。" },
  { family:"姜家", name:"齐简公", title:"齐简公(田常弑之)",start:-484, end:-481, influence:10,
    bio:"齐简公（？–前481），姜姓吕氏，齐景公之子。即位后试图削弱田氏势力——任用阚止为政与田常对抗。前481年田常发动政变——杀阚止和齐简公。齐简公是姜齐最后一位试图抵抗田氏的君主——他的死标志着姜齐政权名存实亡。田常立简公之弟为齐平公——田氏自此专齐政。" },
  { family:"姜家", name:"齐平公", title:"齐平公(田氏专齐)",start:-480, end:-456, influence:5,
    bio:"齐平公（？–前456），姜姓吕氏，齐简公之弟。田常杀简公后立他为傀儡。在位期间田常「割齐自安平以东至琅邪」为田氏封邑——面积大于齐国公室直辖地。齐平公在田氏的完全控制下度过了二十五年的傀儡生涯。前456年去世——传位于子齐宣公。" },
  { family:"姜家", name:"齐宣公", title:"齐宣公",         start:-455, end:-405, influence:5,
    bio:"齐宣公（？–前405），姜姓吕氏，齐平公之子。在位期间田家的势力已完全凌驾于姜姓公室之上。田庄子（田白）和后来的田和相继掌控齐国朝政。齐宣公虽有国君之名，实际上「政在田氏」。前405年去世——此时距田氏正式取代姜齐只剩不到二十年。" },
  { family:"姜家", name:"齐康公", title:"齐康公(姜齐绝祀)",start:-404, end:-384, influence:3,
    bio:"齐康公（？–前384），姜姓吕氏，齐宣公之子。姜齐最后一位君主。在位期间田和已完成对姜姓公室的架空。前391年田和将他迁至海滨——仅给一座城池作为食邑。前386年田和正式被周安王册命为诸侯——姜齐灭亡。前384年齐康公去世——太公望以来的姜齐社稷延续六百余年至此断绝。孔子曰：「齐一变至于鲁，鲁一变至于道」——惜姜齐未及变便亡。" },

  // ═══ 田家 — 田齐 (Tian Qi) · slot 57 ═══
  { family:"田家", name:"田常",   title:"田常(弑简公专齐政)",start:-481, end:-468, influence:50,
    bio:"田常（？–前468），妫姓田氏，陈完之后，代姜氏有齐。田乞之子。前481年弑杀齐简公——立齐平公为傀儡，自任相国。此后「齐国之政皆归于田常」。他野心勃勃——「割齐自安平以东至琅邪」作为田氏封邑，远大于齐国公室直辖之地。为增加田氏人口——选齐国身高七尺以上的女子充实后宫，纵容宾客出入不禁。他死后田氏继续掌控齐国。" },
  { family:"田家", name:"田盘",   title:"田盘(田襄子)",   start:-467, end:-461, influence:35,
    bio:"田盘（？–前461），妫姓田氏，田常之子。继承父亲的事业——继续以相国身份掌控齐国朝政。他让田氏兄弟宗人出任齐国各都邑的大夫——「使兄弟宗人尽为齐都邑大夫」。田氏对齐国地方的控制由此全面强化。前461年去世——田氏代齐的进程在他手中又推进了一大步。" },
  { family:"田家", name:"田白",   title:"田白(田庄子)",   start:-460, end:-411, influence:30,
    bio:"田白（？–前411），妫姓田氏，田盘之子。相齐宣公——继续以田氏宗主的身份掌控齐国。在位期间田氏几乎已「三分齐国而有其二」。前411年去世——此时姜姓公室的存在已完全是一个形式。传位于子田和——田和完成了田氏代齐的最后一步。" },
  { family:"田家", name:"田和",   title:"田和(列为诸侯)", start:-410, end:-384, influence:30,
    bio:"田和（？–前384），妫姓田氏，田白之子。前391年将姜齐最后一位君主齐康公迁至海滨——仅给一城作为食邑。前387年与魏文侯在浊泽相会——请求魏文侯向周天子说情册封自己为诸侯。前386年周安王正式册命田和为齐侯——「田氏代齐」正式完成。前384年去世——在位期间完成了从姜齐到田齐的政权交替。" },
  { family:"田家", name:"齐威王", title:"齐威王(田因齐,邹忌变法)",start:-356, end:-320, influence:65,
    bio:"齐威王（？–前320），妫姓田氏，田和之孙。即位初期沉湎酒色不理朝政——「百官荒乱，诸侯并侵」。邹忌以弹琴讽谏后幡然醒悟——「不鸣则已，一鸣惊人」。重用邹忌改革、田忌和孙膑领军——前353年桂陵之战和前341年马陵之战两败魏军（「围魏救赵」的经典战例）。在临淄设立稷下学宫——战国百家争鸣最璀璨的学术中心。任用淳于髡、邹忌等贤臣。晚年猜忌田忌——逼其逃亡楚国。前320年去世。" },
  { family:"田家", name:"齐宣王", title:"齐宣王(田辟疆)", start:-319, end:-301, influence:50,
    bio:"齐宣王（？–前301），妫姓田氏，齐威王之子。继续扩大稷下学宫——「数百千人」汇集临淄，孟子荀子邹衍等大师活跃于此。前314年趁燕国内乱派匡章伐燕——「五旬而举之」五十天就占领燕国全境。但齐军过于残暴引起燕人反抗——最终被迫撤军。喜好音乐和狩猎——「滥竽充数」的典故即来自宣王宫中。前301年去世。" },
  { family:"田家", name:"齐湣王", title:"齐湣王(田地,称东帝)",start:-300, end:-284, influence:40,
    bio:"齐湣王（？–前284），妫姓田氏，齐宣王之子。名田地。前期颇有作为——灭宋国（前286年），宋王偃被杀。灭宋后齐国达到战国时期最大疆域。前288年与秦昭襄王并称东西二帝（后去帝号）。但灭宋引发众怒——前284年燕昭王派乐毅率燕赵韩魏秦五国联军伐齐。齐军大败——乐毅连下齐国七十余城，齐湣王逃亡途中被楚将淖齿杀死。齐国几乎亡国——只剩莒和即墨两城。" },
  { family:"田家", name:"齐襄王", title:"齐襄王(田法章)", start:-283, end:-265, influence:25,
    bio:"齐襄王（？–前265），妫姓田氏，齐湣王之子。湣王被杀后他藏匿在莒城太史敫家中为佣人——改名换姓。后被齐国大臣找到拥立为齐王。即位后以田单为将——田单在即墨用火牛阵大破燕军，一举收复齐国七十余城（前279年）。复国后他在位十九年——齐国虽复受重创已不复战国两强（齐秦）的格局。前265年去世。" },
  { family:"田家", name:"君王后", title:"君王后(摄政)",   start:-264, end:-249, influence:55,
    bio:"君王后（？–前249），妫姓田氏，齐襄王之后。本是莒城太史敫之女——襄王落难时她不顾父亲反对与襄王结为夫妻。襄王去世后儿子齐王建年幼——她以太后身份摄政十五年。她是一位极其精明的女政治家——对齐国外交采取「谨事秦、与诸侯信」的策略，使齐国在秦国发动统一战争期间保持中立而没有遭到入侵——但也因此坐视五国被秦逐一消灭。前249年去世。" },
  { family:"田家", name:"齐王建", title:"齐王建(田建,降秦)",start:-264, end:-221, influence:10,
    bio:"齐王建（？–？），妫姓田氏，齐襄王之子。母亲君王后摄政时齐国外交保持中立。前249年母亲去世后他听信奸臣后胜——受贿于秦继续不助五国。前230至前221年间秦国逐一消灭韩赵魏楚燕——齐国始终按兵不动。前221年秦将王贲率军从燕国南下直取临淄——齐王建不战而降。齐国灭亡——战国时代终结。秦王政将他流放至共地——「处之共松柏之间，饿而死」。" },

  // ═══ 芈家 — 楚国 (Chu State) · slot 58 ═══
  { family:"芈家", name:"熊寻",   title:"熊寻(楚君)",     start:-821, end:-800, influence:15,
    bio:"熊寻（？–前800），芈姓熊氏，楚国为芈姓，与秦宣太后（芈八子）同姓。西周晚期楚君，事迹《史记·楚世家》记载简略——「熊寻卒，子熊咢立」仅数字而己。楚国此时尚处于长江中游的开拓阶段，势力范围局限于荆山一带。前800年去世传位于子若敖。" },
  { family:"芈家", name:"若敖",   title:"若敖(熊仪)",     start:-799, end:-791, influence:10,
    bio:"若敖（？–前791），芈姓熊氏，熊寻之子。在位仅九年。楚国此时尚在周王室的「南土」范围之外——政治影响力有限。若敖死后楚国经历了一段传承期——子霄敖、孙蚡冒相继即位，楚国势力缓慢向江汉平原扩张。前791年去世。" },
  { family:"芈家", name:"霄敖",   title:"霄敖(熊坎)",     start:-790, end:-764, influence:10,
    bio:"霄敖（？–前764），芈姓熊氏，若敖之子。在位二十七年。此期正值周平王东迁——东周（春秋）开始。周室东迁后对南方的控制力大幅减弱，楚国获得了在江汉流域不受约束的扩张机会。霄敖时期为后来的楚武王称王奠定了基础。前764年去世。" },
  { family:"芈家", name:"蚡冒",   title:"蚡冒(熊眴)",     start:-763, end:-758, influence:8,
    bio:"蚡冒（？–前758），芈姓熊氏，霄敖之子。在位仅六年。他继承父亲的扩张政策——「蚡冒启濮」向江汉平原的濮人部落拓展领土。楚国从此开始摆脱周朝诸侯的身份认同——《史记》称「蚡冒之时，楚始大」。但他的扩张成果很快被他的弟弟楚武王超越。" },
  { family:"芈家", name:"楚武王", title:"楚武王(熊通,僭号称王)",start:-740, end:-690, influence:55,
    bio:"楚武王（？–前690），芈姓熊氏，蚡冒之弟。弑蚡冒之子自立为君。前706年要求周天子提升楚的爵位被拒——大怒之下「王不加位，我自尊耳」于前704年自立为王。楚国从此公开不承认周天子的宗法权威——是第一个称王的诸侯。在位五十一年大大扩张楚国疆土——三次伐随（「汉阳诸姬，楚实尽之」）。前690年征伐随国途中病逝于樠木之下——至死也未停止征伐。" },
  { family:"芈家", name:"楚文王", title:"楚文王(都郢)",   start:-689, end:-677, influence:40,
    bio:"楚文王（？–前677），芈姓熊氏，楚武王之子。将国都从丹阳迁至郢（今湖北荆州）——郢都从此成为楚国四百余年的政治中心。在位期间灭申、息二国——楚国势力深入中原南部。伐蔡国俘虏蔡哀侯。前677年去世——征伐巴国时在津（今湖北江陵）病逝。他在位期间楚国从长江中游的地方强国向中原大国迈进。" },
  { family:"芈家", name:"楚成王", title:"楚成王(城濮之战)",start:-671, end:-626, influence:50,
    bio:"楚成王（？–前626），芈姓熊氏，楚文王之子。弑兄庄敖自立。即位后「布德施惠」——向周天子进贡获得「镇尔南方夷越之乱」的合法授权，楚国合法地整合长江流域。前656年齐桓公率诸侯之师讨楚——使者屈完对曰「君若以力楚国方城以为城汉水以为池」——齐桓公退兵（「召陵之盟」）。前632年城濮之战败于晋文公。晚年在立太子问题上反复——前626年被太子商臣（楚穆王）弑杀。临终前要求吃熊掌——太子不等熊掌做熟便杀了他。" },
  { family:"芈家", name:"楚穆王", title:"楚穆王",         start:-625, end:-614, influence:25,
    bio:"楚穆王（？–前614），芈姓熊氏，楚成王之子。名商臣，弑父自立。在位期间继续北上扩张——灭江国、六国、蓼国。但他最大的功绩是稳定了弑父篡位后的楚国政局——用武力压制了国内外的反对者。前614年去世——传位于其子楚庄王。虽然他得位不正——但他为楚庄王的霸业奠定了坚实的基础。" },
  { family:"芈家", name:"楚庄王", title:"楚庄王(问鼎中原,五霸之一)",start:-613, end:-591, influence:80,
    bio:"楚庄王（？–前591），芈姓熊氏，楚穆王之子。春秋五霸之一。即位初三年沉湎酒色——伍举以「有鸟在于阜三年不蜚不鸣是何鸟也」讽谏，庄王对曰「三年不蜚蜚将冲天，三年不鸣鸣将惊人」——自此一飞冲天。任用孙叔敖为令尹——兴修水利、整顿军备。前606年北伐至洛水「问鼎中原」。前597年邲之战大败晋军——一举确立楚国霸权。在位二十三年的霸业是楚国最辉煌的时期。前591年病逝——临终遗言「无德而贪」戒子。" },
  { family:"芈家", name:"楚共王", title:"楚共王(鄢陵之战)",start:-590, end:-560, influence:30,
    bio:"楚共王（？–前560），芈姓熊氏，楚庄王之子。十岁即位——由令尹子重辅政。前575年鄢陵之战中晋国大败楚军——楚共王被晋将吕锜射中眼睛。此战楚国霸权受挫——晋国复霸中原。临死前他对自己的失误耿耿于怀——要求谥一个恶谥「灵」或「厉」，大夫们最终谥以「共」。" },
  { family:"芈家", name:"楚康王", title:"楚康王",         start:-559, end:-545, influence:15,
    bio:"楚康王（？–前545），芈姓熊氏，楚共王之子。在位十五年。前546年楚国参与了宋国向戌发起的「弭兵之会」——晋楚平分霸权。弭兵之后中原进入相对和平期——楚国将更多精力转向整合南方和东方的新征服区域。前545年去世——楚国开始出现内部政治腐败的苗头。" },
  { family:"芈家", name:"楚郏敖", title:"楚郏敖(熊员)",   start:-544, end:-541, influence:8,
    bio:"楚郏敖（？–前541），芈姓熊氏，楚康王之子。名熊员。在位仅四年——由叔叔公子围（楚灵王）为令尹掌管朝政。前541年公子围趁楚郏敖生病时入宫探视——「入问王疾，缢而弑之」。楚郏敖是楚国第一位被叔叔以探病为名缢杀的君主——此后楚国政变不断。" },
  { family:"芈家", name:"楚灵王", title:"楚灵王(弃疾弑立)",start:-540, end:-529, influence:20,
    bio:"楚灵王（？–前529），芈姓熊氏，楚共王之子、楚康王之弟。名围，弑侄楚郏敖自立。奢侈残暴——大建章华台「穷土木之技、殚珍府之实」。伐吴国不克。前529年其弟公子弃疾（楚平王）发动政变——楚灵王众叛亲离流亡山中，数日无食饿死。他最终「死于申亥之家」——一个山野之人将他收留并给他食物。他是楚国贪暴之君的典型——《左传》对他评价极低。" },
  { family:"芈家", name:"楚平王", title:"楚平王(伍奢之难)",start:-528, end:-516, influence:20,
    bio:"楚平王（？–前516），芈姓熊氏，楚共王之子、楚灵王之弟。名弃疾。政变杀楚灵王和幼君子比后自立。即位初期稍有作为——恢复被灵王破坏的内政。但很快腐化——听信费无忌谗言：夺太子建之妻、杀太子太傅伍奢及其长子伍尚。伍奢次子伍员（伍子胥）逃亡吴国——十六年后率吴军灭楚入郢。楚平王死后被伍子胥掘墓鞭尸。他为楚国带来了存亡之祸。" },
  { family:"芈家", name:"楚昭王", title:"楚昭王(吴入郢,申包胥哭秦庭)",start:-515, end:-489, influence:30,
    bio:"楚昭王（？–前489），芈姓熊氏，楚平王之子。在位期间经历了楚国最大的危机。前506年吴王阖闾在伍子胥孙武辅佐下大举伐楚——五战入郢，楚昭王逃亡随国。楚大夫申包胥到秦国求救——在秦庭哭了七天七夜终于感动秦哀公出兵救楚。楚昭王复国后吸取教训——「抚民治国」楚国一度复兴。前489年征伐途中病逝。" },
  { family:"芈家", name:"楚惠王", title:"楚惠王(灭陈蔡)", start:-488, end:-432, influence:30,
    bio:"楚惠王（？–前432），芈姓熊氏，楚昭王之子。在位五十七年是楚国在位最长的君主之一。前478年灭陈国、前447年灭蔡国——楚国疆域向东扩展至淮河流域。前479年白公胜之乱被平定。在位期间楚国国力恢复——但已难以回到楚庄王时期的霸业水平。前432年去世——楚国进入战国中期的转型期。" },
  { family:"芈家", name:"楚简王", title:"楚简王",         start:-431, end:-408, influence:15,
    bio:"楚简王（？–前408），芈姓熊氏，楚惠王之子。在位二十四年。此期正值韩国灭郑（前375年）、魏国在李悝变法后称雄中原。楚国在战国七雄中力图维持大国地位——但内部政治改革的缺乏使楚国在新一轮竞争中处于劣势。前408年去世。" },
  { family:"芈家", name:"楚声王", title:"楚声王",         start:-407, end:-402, influence:10,
    bio:"楚声王（？–前402），芈姓熊氏，楚简王之子。在位仅六年——强盗入宫将其杀死，是战国唯一被盗贼入宫杀死的君主。此事件反映楚国朝政的混乱程度。传位于子楚悼王——楚悼王任用吴起变法试图扭转楚国颓势。声王之死加速了楚国的变法需求。" },
  { family:"芈家", name:"楚悼王", title:"楚悼王(吴起变法)",start:-401, end:-381, influence:25,
    bio:"楚悼王（？–前381），芈姓熊氏，楚声王之子。痛感楚国积弱不振——前390年左右任用从魏国逃来的吴起为令尹推行变法。「明法审令、捐不急之官、废公族疏远者」——裁减冗官贵族、抚养战斗之士。变法使楚国迅速强盛——南平百越、北并陈蔡、西伐秦国。但变法触动了旧贵族的利益。前381年悼王去世——旧贵族趁机在灵堂上射杀吴起，吴起趴在悼王尸体上——贵族们射中吴起的同时也射中了悼王的尸体。新王即位后将射尸者全部处死——七十余家贵族被灭门。" },
  { family:"芈家", name:"楚肃王", title:"楚肃王",         start:-380, end:-370, influence:15,
    bio:"楚肃王（？–前370），芈姓熊氏，楚悼王之子。即位后按楚国法律处死了在悼王灵堂上射杀吴起时射中悼王尸体的七十余家贵族。吴起变法虽然失败——但楚国贵族势力受到重创。在位十一年维持了楚国的大国地位。前370年去世。" },
  { family:"芈家", name:"楚宣王", title:"楚宣王",         start:-369, end:-340, influence:25,
    bio:"楚宣王（？–前340），芈姓熊氏，楚肃王之弟。在位三十年。此期秦国在商鞅变法后迅速崛起——楚国面临来自西线的日益增长的秦国压力。宣王在秦楚齐三大国的博弈中谨慎周旋。前340年去世——此时秦国已完成商鞅变法，楚国的战略环境急剧恶化。" },
  { family:"芈家", name:"楚威王", title:"楚威王(灭越)",   start:-339, end:-329, influence:30,
    bio:"楚威王（？–前329），芈姓熊氏，楚宣王之子。前334年灭越国——越王无彊被楚所杀，越国灭亡。楚国疆域向东扩展至浙江。前333年齐国与楚国在徐州大战——楚军大败齐军。楚威王在位期间楚国在战国七雄中试图恢复大国地位。但苏秦评价他「地方五千里、带甲百万」——楚国最大的问题是政治改革不彻底旧贵族势力根深蒂固。前329年去世。" },
  { family:"芈家", name:"楚怀王", title:"楚怀王(入秦不返)",start:-328, end:-299, influence:25,
    bio:"楚怀王（？–前296），芈姓熊氏，楚威王之子。名槐。即位初期有所作为——用屈原推行改革，楚国一度显现复兴迹象。但听信宠臣靳尚和秦使张仪的欺骗——为「商於六百里地」与齐绝交，结果秦国只给了六里地。盛怒之下两次伐秦均大败——「丹阳之战」和「蓝田之战」楚国丧师失地。前299年秦昭襄王约他入秦会盟——被秦国扣留，三年后死于秦国。他的悲剧开启了楚国无可挽回的衰落——这也成为屈原《离骚》的创作背景。" },
  { family:"芈家", name:"楚顷襄王",title:"楚顷襄王(失郢都)",start:-298, end:-263, influence:15,
    bio:"楚顷襄王（？–前263），芈姓熊氏，楚怀王之子。父亲被扣留秦国期间即位。前期任用屈原等贤臣试图恢复国力。但很快荒淫——「专淫逸侈靡不顾国政」。前278年秦将白起攻破楚国都城郢——火烧夷陵楚先王陵墓。楚国被迫迁都至陈（今河南淮阳）——失去了经营四百年的核心区域。屈原在绝望中投汨罗江自尽。顷襄王在位期间楚国从一流大国降为二流。" },
  { family:"芈家", name:"楚考烈王",title:"楚考烈王(黄歇为相)",start:-262, end:-238, influence:20,
    bio:"楚考烈王（？–前238），芈姓熊氏，楚顷襄王之子。早年曾在秦国为人质。即位后以春申君黄歇为令尹——迁都至寿春（今安徽寿县）以避秦之锋芒。前258年春申君率楚军救赵——与信陵君的魏军合力大败秦军于邯郸城下。前256年楚国还趁机灭掉了鲁国。但秦国统一天下的趋势已不可阻挡。前238年去世——他与春申君的「无子之谜」（李园献妹事件）至今仍是一个疑案。" },
  { family:"芈家", name:"楚幽王", title:"楚幽王(李园专权)",start:-237, end:-228, influence:10,
    bio:"楚幽王（？–前228），芈姓熊氏，楚考烈王之子（一说为春申君与李园之妹所生）。即位后由国舅李园专权——春申君黄歇被李园伏兵刺杀身亡。此时秦国已灭韩国正在进攻赵国——楚国在秦国四面合围中苟延残喘。前228年去世——同年秦灭赵邯郸。" },
  { family:"芈家", name:"楚哀王", title:"楚哀王(在位两月)",start:-228, end:-228, influence:3,
    bio:"楚哀王（？–前228），芈姓熊氏，楚幽王之弟。即位仅两个月便被其异母兄负刍的党羽刺杀——「负刍之徒袭杀哀王」。楚国王室在亡国前夕的骨肉相残反映了楚国上层政治的彻底崩溃。哀王是楚国倒数第二位君主——他的被杀加速了楚国的灭亡。" },
  { family:"芈家", name:"楚王负刍",title:"楚王负刍(秦灭楚)",start:-227, end:-223, influence:8,
    bio:"楚王负刍（？–？），芈姓熊氏，楚考烈王之子。弑弟哀王自立。前224年秦王政派王翦率六十万大军伐楚——楚国派项燕率军抵抗。王翦「坚壁不出」一年消耗楚军锐气——最终一举击溃楚军主力俘杀项燕。前223年秦军攻破楚都寿春俘虏楚王负刍——楚国灭亡。楚王负刍被押送咸阳。楚国是六国中抵抗最顽强的——项燕虽败楚人不忘，后来的「亡秦必楚」正是来源于楚国。" },

  // ═══ 吴家 — 吴国 (Wu State) · slot 59 ═══
  { family:"吴家", name:"吴王寿梦",title:"寿梦(吴始通中原)",start:-585, end:-561, influence:30,
    bio:"寿梦（？–前561），姬姓，自称太伯奔吴之后，与周王室同宗。吴国第十九代君主。前584年楚国亡臣申公巫臣逃至吴国教吴人车战之术——吴国开始通于中原。「吴始通中国」标志着吴国从东南蛮荒进入中原争霸格局。在位二十六年大大提升吴国的军事技术和国力。前561年去世——遗命诸子兄终弟及。" },
  { family:"吴家", name:"吴王僚",   title:"吴王僚",         start:-526, end:-515, influence:15,
    bio:"吴王僚（？–前515），姬姓，吴王寿梦之孙。在位十二年。前522年伍子胥从楚国逃亡至吴国——成为公子光（后来的吴王阖闾）的谋士。前515年公子光派刺客专诸以鱼肠剑刺杀吴王僚——「专诸刺僚」是春秋四大刺客故事之一。吴王僚之死为阖闾的霸业拉开了序幕。" },
  { family:"吴家", name:"吴王阖闾", title:"阖闾(伍员孙武,破楚入郢)",start:-514, end:-496, influence:75,
    bio:"阖闾（？–前496），姬姓，吴王寿梦之孙。名光。前515年刺僚后即位。重用伍子胥（伍员）和孙武——「西破强楚，入郢；北威齐晋，显名诸侯」。前506年伐楚——以三万吴军五战五胜攻入楚国都城郢，楚昭王逃亡。伍子胥掘楚平王墓鞭尸。后因秦军救楚和越国偷袭而退兵。前496年攻越——在檇李之战中被越军击败，脚趾受伤而死。死前嘱子夫差「必毋忘越」。" },
  { family:"吴家", name:"吴王夫差", title:"夫差(夫椒败越,黄池会盟,亡于越)",start:-495, end:-473, influence:40,
    bio:"夫差（？–前473），姬姓，阖闾之子。即位后不忘父仇——让人每天在宫门前喊「夫差，而忘越王之杀而父乎」。前494年夫椒之战大败越国——勾践仅剩五千残兵退守会稽山。勾践派文种贿赂吴太宰伯噽求和——伍子胥力主灭越夫差不听。北上争霸——前482年黄池会盟与晋争为盟主。但勾践趁虚而入——攻破吴都姑苏。前473年越军攻入姑苏——夫差自杀身亡，吴国灭亡。死前以布蒙面——「吾无面目以见子胥也」。" },

  { family:"越家", name:"越王允常", title:"允常(越始大)",   start:-537, end:-497, influence:20,

  'var(--slot-20)','var(--slot-21)','var(--slot-22)','var(--slot-23)',
  'var(--slot-24)','var(--slot-25)','var(--slot-26)','var(--slot-27)',
  'var(--slot-28)','var(--slot-29)','var(--slot-30)','var(--slot-31)',
  'var(--slot-32)','var(--slot-33)','var(--slot-34)','var(--slot-35)',
  'var(--slot-36)','var(--slot-37)','var(--slot-38)','var(--slot-39)',
  'var(--slot-40)','var(--slot-41)','var(--slot-42)','var(--slot-43)',
  'var(--slot-44)','var(--slot-45)','var(--slot-46)','var(--slot-47)',
  'var(--slot-48)','var(--slot-49)','var(--slot-50)',
  'var(--slot-51)','var(--slot-52)','var(--slot-53)','var(--slot-54)',
  'var(--slot-55)','var(--slot-56)','var(--slot-57)','var(--slot-58)',
  'var(--slot-59)','var(--slot-60)','var(--slot-61)','var(--slot-62)',
  'var(--slot-63)','var(--slot-64)','var(--slot-65)'
];
const familyMeta = families.map((name, i) => ({
  name,
  color: SLOTS[i],
  members: rawData.filter(d => d.family === name),
}));
const famMap = Object.fromEntries(familyMeta.map(f => [f.name, f]));

// Stack order: families sorted by first appearance year descending.
// Latest debut → first in iteration (stack bottom, y0=0).
// Earliest debut → last in iteration (stack top).
// Families with same debut year preserve their original familyMeta order.
// Reasoning: when a new family debuts, all families sorted below it
// (later debut years) haven't appeared yet (pct=0), so the new family
// naturally rises from the bottom (y0=0). As even newer families debut
// below it, it gets pushed upward — like geological strata.
const familyDebutYear = {};
for (const fam of familyMeta) {
  familyDebutYear[fam.name] = Math.min(...fam.members.map(m => m.start));
}
const stackOrder = [...familyMeta].sort((a, b) => {
  const da = familyDebutYear[a.name];
  const db = familyDebutYear[b.name];
  if (da !== db) return db - da;  // descending by debut year
  return familyMeta.indexOf(a) - familyMeta.indexOf(b);  // preserve original order
});

// Compute each family's lifecycle: first member start → last member end
// Used to bridge internal gaps with zero-width hairline connectors
const familyLifecycle = {};
for (const fam of familyMeta) {
  const starts = fam.members.map(m => m.start);
  const ends   = fam.members.map(m => m.end);
  familyLifecycle[fam.name] = {
    start: Math.min(...starts),
    end:   Math.max(...ends),
  };
}

const T_MIN = d3.min(rawData, d => d.start);
const T_MAX = d3.max(rawData, d => d.end);

/* ═══════════════════════════════════════════════════════════════════
   Compute time series: yearly resolution, normalized to percentages
   ═══════════════════════════════════════════════════════════════════ */

function computeSeries() {
  const series = [];
  for (let year = T_MIN; year <= T_MAX; year++) {
    const point = { year };
    let totalRaw = 0;
    for (const fam of familyMeta) {
      let sum = 0;
      const activeMembers = [];
      for (const m of fam.members) {
        if (year >= m.start && year <= m.end) {
          let inf = m.influence;
          // smooth ramp in/out over 2 years
          // fadeIn/fadeOut offset by +1: at contiguous boundaries
          // (prev.end == curr.start) neither drops to zero, keeping
          // the family area continuous — no more white vertical gaps
          const fadeIn  = Math.min(1, (year - m.start + 1) / 2);
          const fadeOut = Math.min(1, (m.end - year + 1) / 2);
          inf *= Math.min(fadeIn, fadeOut);
          sum += inf;
          if (inf > 0.1) activeMembers.push({ name: m.name, title: m.title, raw: inf });
        }
      }
      const inLifecycle = year >= familyLifecycle[fam.name].start && year <= familyLifecycle[fam.name].end;
      const isGap = inLifecycle && sum < 0.001;
      point[fam.name] = { raw: sum, members: activeMembers, _inLifecycle: inLifecycle, _isGap: isGap };
      totalRaw += sum;
    }
    // Normalize
    for (const fam of familyMeta) {
      const pct = totalRaw > 0.001 ? (point[fam.name].raw / totalRaw) * 100 : 0;
      point[fam.name].pct = pct;
    }
    series.push(point);
  }
  return series;
}

const timeSeries = computeSeries();

// Build pre-stacked data: for each year, y0/y1 per family
// Families in a lifecycle gap get a hairline bridge (~0.08%) to keep
// their stack slot alive and maintain vertical continuity.
const HAIRLINE_PCT = 0.01;

function buildStackedData(series) {
  return series.map(point => {
    const stack = [];
    let cum = 0;
    for (const fam of stackOrder) {
      const data = point[fam.name];
      const pct = data.pct;
      if (data._isGap) {
        // Hairline bridge: reserve a tiny slot so the family still
        // occupies its stack position during internal gaps
        stack.push({
          family: fam.name, y0: cum, y1: cum + HAIRLINE_PCT,
          pct: 0, members: [], gapBridge: true,
        });
        cum += HAIRLINE_PCT;
      } else {
        stack.push({
          family: fam.name, y0: cum, y1: cum + pct,
          pct, members: data.members, gapBridge: false,
        });
        cum += pct;
      }
    }
    return { year: point.year, stack };
  });
}

const stackedData = buildStackedData(timeSeries);

/* ═══════════════════════════════════════════════════════════════════
   Pre‑indexed structures — O(1) year access, O(1) family-series access
   Eliminates the per-frame O(48²N) stack.find scans.
   ═══════════════════════════════════════════════════════════════════ */

// yearRow: year → stackedData row, direct-array index by year-T_MIN.
// Years are T_MIN..T_MAX continuous; if a gap is detected we fall back
// to a Map (the check runs once at init — negligible cost).
const yearRow = [];
let _yearsContinuous = true;
for (let i = 0; i < stackedData.length; i++) {
  const y = stackedData[i].year;
  yearRow[y - T_MIN] = stackedData[i];
}
for (let y = T_MIN; y <= T_MAX; y++) {
  if (!yearRow[y - T_MIN]) { _yearsContinuous = false; break; }
}
const _yearGet = _yearsContinuous
  ? (year) => yearRow[year - T_MIN]
  : (year) => { for (const r of stackedData) if (r.year === year) return r; };

// seriesByFamily: Map famName → [{year,y0,y1,pct,gapBridge,members}] sorted by year.
// Built once from stackedData; replaces the per-frame stackedData.filter(d => …).find()
// pattern that scanned O(48 families × N years × 48 find) on every render.
const seriesByFamily = new Map();
for (const fam of familyMeta) seriesByFamily.set(fam.name, []);
for (const row of stackedData) {
  for (const s of row.stack) {
    seriesByFamily.get(s.family).push({
      year: row.year, y0: s.y0, y1: s.y1,
      pct: s.pct, gapBridge: s.gapBridge, members: s.members,
    });
  }
}
// Series are built in stackedData order (ascending year); no extra sort needed.

/* ═══════════════════════════════════════════════════════════════════
   Dimensions
   ═══════════════════════════════════════════════════════════════════ */

const MAIN_H = 500;
const MAIN_MARGIN = { top: 24, right: 36, bottom: 44, left: 52 };
const BRUSH_H = 76;
const BRUSH_MARGIN = { top: 8, right: 36, bottom: 30, left: 52 };

// y 像素只依赖固定常量(MAIN_H/margins)，启动期一次性预计算到 seriesByFamily，
// 渲染帧内零分配、零 scale 调用（地图瓦片式烘焙）。
const _hMainPx = MAIN_H - MAIN_MARGIN.top - MAIN_MARGIN.bottom;
const _yMainPx = d3.scaleLinear().domain([0, 100.2]).range([_hMainPx, 0]);
for (const _arr of seriesByFamily.values()) {
  for (const _p of _arr) { _p.y0px = _yMainPx(_p.y0); _p.y1px = _yMainPx(_p.y1); }
}

/* ═══════════════════════════════════════════════════════════════════
   State + scaffold infrastructure (R5: scaffold-once architecture)
   ═══════════════════════════════════════════════════════════════════ */

let currentView = { tMin: T_MIN, tMax: T_MAX };
let isPlaying = false;
let animId = null;

// ── Static brush cache + touch rAF state ──
let _brushCache = null;        // { W, brush, brushG, xFull }

// ── Scaffold persistent elements (built once, updated in-place) ──
let _scaffoldBuilt = false;
let _svg, _mainG, _clipG, _moveG, _areasG, _bridgesG, _labelsG;
let _xAxisG, _yAxisG, _gridG, _baseline, _crossLine;
let _xScale, _yScale;          // current scales (updated each renderMain)
let _w, _h, _M;                // current inner dimensions + margin ref
let _areaPaths = [];           // 48 persistent area paths
let _bridgePaths = [];         // expandable bridge-line path pool
let _labelTexts = [];          // expandable label text pool
let _labelSubTexts = [];       // expandable label subtitle pool
let _denseArea = false;        // cached LOD curve strategy flag

// ── Gesture transform state ──
let _gestureActive = false;
let _gestureAnchorView = null; // {tMin, tMax} - latest re-anchor view (padded)
let _gestureRenderedView = null; // {tMin, tMax} - what was actually rendered
let _gesturePxPerYear = 0;
let _gesturePinchSpan0 = 0;
let _gesturePinchAnchorYear = 0;

// ── Playback transform state ──
let _pbActive = false;
let _pbAnchorView = null;
let _pbRenderedView = null;
let _pbPxPerYear = 0;
let _pbPrevView = null;        // for dirty-check skip
let _pbDirection = 0;          // +1 right, -1 left, 0 unknown
let _pbWrapPending = false;

/* ═══════════════════════════════════════════════════════════════════
   Viewport clamping — unified entry for ALL currentView mutations.
   Preserves window span; when panning hits an edge the window sticks.
   (Iron rule 2: semantics unchanged from R1-R4)
   ═══════════════════════════════════════════════════════════════════ */

function clampView(view) {
  const winSize = view.tMax - view.tMin;
  if (view.tMin < T_MIN) {
    view.tMin = T_MIN;
    view.tMax = Math.min(T_MAX, T_MIN + winSize);
  }
  if (view.tMax > T_MAX) {
    view.tMax = T_MAX;
    view.tMin = Math.max(T_MIN, T_MAX - winSize);
  }
  if (view.tMax - view.tMin < 4) {
    const mid = (view.tMin + view.tMax) / 2;
    view.tMin = Math.max(T_MIN, Math.round(mid - 2));
    view.tMax = Math.min(T_MAX, Math.round(mid + 2));
    if (view.tMax - view.tMin < 4) {
      view.tMax = Math.min(T_MAX, view.tMin + 4);
    }
  }
  return view;
}

/* ═══════════════════════════════════════════════════════════════════
   LOD helpers (unchanged from R4)
   ═══════════════════════════════════════════════════════════════════ */

function splitBridgeSegments(pts, extendN) {
  if (pts.length === 0) return [];
  const segs = [];
  let cur = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].gapBridge === pts[i - 1].gapBridge) {
      cur.push(pts[i]);
    } else {
      segs.push(cur);
      cur = [pts[i]];
    }
  }
  segs.push(cur);
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    if (!segs[i][0].gapBridge) continue;
    const ext = [...segs[i]];
    if (i > 0) ext.unshift(...segs[i - 1].slice(-extendN));
    if (i < segs.length - 1) ext.push(...segs[i + 1].slice(0, extendN));
    out.push(ext);
  }
  return out;
}

function decimateSlice(slice, maxPoints) {
  const n = slice.length;
  if (n <= maxPoints) return slice;
  const k = Math.ceil(n / maxPoints);
  const keep = new Set();
  keep.add(0);
  keep.add(n - 1);
  for (let i = 0; i < n; i++) {
    const b = !!slice[i].gapBridge;
    const pb = i > 0 ? !!slice[i - 1].gapBridge : !b;
    if (b !== pb) {
      keep.add(i);
      if (i > 0) keep.add(i - 1);
      if (i < n - 1) keep.add(i + 1);
    }
  }
  for (let i = 0; i < n; i += k) keep.add(i);
  return [...keep].sort((a, b) => a - b).map(i => slice[i]);
}

/* ═══════════════════════════════════════════════════════════════════
   buildScaffold() — create persistent DOM once (init + resize).
   All elements that survive across renderMain frames live here.
   ═══════════════════════════════════════════════════════════════════ */

function panelWidth() {
  return document.getElementById('chart-panel').clientWidth;
}

function buildScaffold() {
  const W = panelWidth();
  const M = MAIN_MARGIN;
  const w = W - M.left - M.right;
  const h = MAIN_H - M.top - M.bottom;
  const totalW = W;
  const totalH = MAIN_H;

  _w = w; _h = h; _M = M;

  _svg = d3.select('#chart-svg')
    .attr('viewBox', `0 0 ${totalW} ${totalH}`)
    .style('height', totalH + 'px');
  _svg.selectAll('*').remove();

  _mainG = _svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

  // ── defs / clipPath ──
  _mainG.append('defs').append('clipPath').attr('id','main-clip')
    .append('rect').attr('x',0).attr('y',-6).attr('width',w).attr('height',h+12);

  // ── Gridlines (static: y domain [0,100.2] never changes) ──
  _yScale = d3.scaleLinear().domain([0, 100.2]).range([h, 0]);
  const yTicks = _yScale.ticks(5);
  _gridG = _mainG.append('g').attr('class','grid');
  _gridG.selectAll('line').data(yTicks).join('line')
    .attr('x1',0).attr('x2',w)
    .attr('y1',d=>_yScale(d)).attr('y2',d=>_yScale(d))
    .attr('stroke','var(--gridline)').attr('stroke-width',1);

  // ── Y axis (static — y domain never changes) ──
  _yAxisG = _mainG.append('g').call(
    d3.axisLeft(_yScale).tickValues(yTicks).tickFormat(d=>d+'%').tickSize(0).tickPadding(8)
  );
  _yAxisG.selectAll('.tick text').attr('fill','var(--text-muted)').attr('font-size',12);
  _yAxisG.select('.domain').remove();

  // ── X axis (persistent group; domain line created once, ticks updated by updateAxes) ──
  _xAxisG = _mainG.append('g').attr('transform',`translate(0,${h})`);
  _xAxisG.append('path').attr('class','domain').attr('stroke','var(--baseline)').attr('stroke-width',1);

  // ── Baseline at y=0 ──
  _baseline = _mainG.append('line')
    .attr('x1',0).attr('x2',w).attr('y1',h).attr('y2',h)
    .attr('stroke','var(--baseline)').attr('stroke-width',1);

  // ── Content group (clipped, fixed — never moves) ──
  _clipG = _mainG.append('g').attr('clip-path','url(#main-clip)');

  // ── Move group (transform target for gestures / playback) ──
  _moveG = _clipG.append('g').attr('id','move-g');

  // ── Area paths (48 persistent, one per family in stackOrder) ──
  _areasG = _moveG.append('g');
  _areaPaths = stackOrder.map(fam => {
    return _areasG.append('path')
      .attr('fill', fam.color)
      .attr('fill-opacity', 0.82)
      .attr('stroke', 'var(--surface-1)')
      .attr('stroke-width', 2);
  });

  // ── Bridge lines (pool, capacity grows on demand, unused → display:none) ──
  _bridgesG = _moveG.append('g');
  _bridgePaths = [];
  const initBridgePool = 96;
  for (let i = 0; i < initBridgePool; i++) {
    _bridgePaths.push(
      _bridgesG.append('path')
        .attr('fill','none')
        .attr('stroke-width',2)
        .attr('stroke-opacity',1)
        .style('display','none')
    );
  }

  // ── Label pool (text elements ≥180, each has <title> child) ──
  _labelsG = _moveG.append('g');
  _labelTexts = [];
  _labelSubTexts = [];
  const initLabelPool = 200;
  for (let i = 0; i < initLabelPool; i++) {
    const t = _labelsG.append('text')
      .attr('class','person-label')
      .attr('text-anchor','middle')
      .attr('dominant-baseline','auto')
      .style('font-size','12px')
      .style('display','none');
    t.append('title');
    t.append('tspan').attr('class', 'lbl-name');
    _labelTexts.push(t);

    const s = _labelsG.append('text')
      .attr('class','person-label-sub')
      .attr('text-anchor','middle')
      .style('display','none');
    s.append('tspan').attr('class', 'lbl-sub');
    _labelSubTexts.push(s);
  }

  // ── Event delegation on labelsG (replace 85× per-frame click rebind) ──
  _labelsG.on('click', function(event) {
    event.stopPropagation();
    const el = event.target.closest('.person-label');
    if (!el) return;
    const data = el.__data__;
    if (data && data.member) showBio(data.member);
  });

  // ── Crosshair (persistent, display toggled by hover handlers) ──
  _crossLine = _mainG.append('line')
    .attr('y1',0).attr('y2',h)
    .attr('stroke','var(--text-muted)')
    .attr('stroke-width',1)
    .style('display','none');

  // ── Hover-capture rect (listeners bound once, read _xScale via closure) ──
  _mainG.append('rect')
    .attr('class','hover-capture')
    .attr('width',w).attr('height',h)
    .attr('fill','transparent')
    .on('click', function(event) {
      if (window.handleTap) window.handleTap(event.clientX, event.clientY);
    })
    .on('mousemove', function(event) {
      if (!_xScale) return;
      const [mx] = d3.pointer(event);
      const year = Math.round(_xScale.invert(mx));
      const cy = Math.max(currentView.tMin, Math.min(currentView.tMax, year));

      _crossLine.attr('x1',_xScale(cy)).attr('x2',_xScale(cy)).style('display',null);

      // O(1) yearRow lookup replaces stackedData.find
      const pt = _yearGet(cy);
      const tooltip = d3.select('#tooltip');
      if (!pt) { tooltip.style('display','none'); return; }

      let html = '<div class="tt-date">' + (cy < 0 ? '前' + Math.abs(cy) + '年' : cy + '年') + '</div>';
      const sorted = [...pt.stack]
        .filter(s => s.pct > 0.1)
        .sort((a,b) => b.pct - a.pct);
      for (const s of sorted) {
        const fam = famMap[s.family];
        html += '<div class="tt-row">';
        html += '<span class="tt-swatch" style="background:' + fam.color + '"></span>';
        html += '<span class="tt-name">' + s.family + '</span>';
        html += '<span class="tt-pct">' + s.pct.toFixed(1) + '%</span>';
        html += '</div>';
        if (s.members.length > 0) {
          const memStr = s.members.map(m => m.name + '（' + m.title + '）').join('、');
          html += '<div class="tt-members">' + memStr + '</div>';
        }
      }
      tooltip.html(html);

      const panelW = document.getElementById('chart-panel').clientWidth;
      let tx = M.left + _xScale(cy) + 14;
      if (tx + 190 > panelW) tx = M.left + _xScale(cy) - 200;
      tooltip
        .style('left', tx + 'px')
        .style('top', (M.top + 8) + 'px')
        .style('display', 'block');
    })
    .on('mouseleave', function() {
      _crossLine.style('display','none');
      d3.select('#tooltip').style('display','none');
    });

  // ── Legend (built once — families/colors never change) ──
  const legendRow = document.getElementById('legend-row');
  legendRow.innerHTML = familyMeta.map(f =>
    '<span class="legend-item"><span class="legend-swatch" style="background:' + f.color + '"></span>' + f.name + '</span>'
  ).join('');

  _scaffoldBuilt = true;
}

/* ═══════════════════════════════════════════════════════════════════
   renderMain() — lightweight attribute-only update.
   After buildScaffold(), this only mutates attributes (d, transform,
   textContent, display, __data__). No remove/append.

   R6: Layers refactored — axes/grid/crosshair live outside move-g.
   updateAxes(view) is separate so gestures/playback can update ticks
   without triggering a full render.
   ═══════════════════════════════════════════════════════════════════ */

// ── updateAxes(view) — update x-axis ticks/grid for a given view ──
// Uses manual data-join on <g.tick> + textContent mutation (not .text())
// to avoid childList mutations (text node replace) when tick values change.
// ~24 attribute mutations per call.
function updateAxes(view) {
  const axisScale = d3.scaleLinear().domain([view.tMin, view.tMax]).range([0, _w]);
  const xTicks = axisScale.ticks(Math.max(4, Math.floor(_w / 90)));
  const fmt = d => d < 0 ? '前' + Math.abs(d) : String(d);

  // Manual data join so d3 reuses existing <g.x-tick> elements by value-key
  const tick = _xAxisG.selectAll('g.x-tick').data(xTicks, String);
  tick.exit().remove();
  const tickEnter = tick.enter().append('g').attr('class', 'x-tick');
  tickEnter.append('text').attr('fill', 'var(--text-muted)').attr('font-size', 12)
    .attr('y', 9).attr('dy', '0.71em').attr('text-anchor', 'middle');
  const tickMerge = tickEnter.merge(tick);
  tickMerge.each(function(d) {
    const tx = 'translate(' + axisScale(d) + ',0)';
    if (this.__lastTx !== tx) { this.__lastTx = tx; this.setAttribute('transform', tx); }
  });
  // Guard textContent to avoid #text-node replace mutations on identical values
  tickMerge.select('text').each(function(d) {
    const v = fmt(d);
    if (this.__lastText !== v) { this.__lastText = v; this.textContent = v; }
  });

  // Domain line (created once in buildScaffold)
  _xAxisG.select('.domain')
    .attr('stroke', 'var(--baseline)').attr('stroke-width', 1)
    .attr('d', 'M0,0.5H' + _w);
}

// ── _renderContent() — core area/bridge/label rendering ──
// Assumes _xScale is already set and currentView reflects content domain.
// All content uses _xScale for positioning; clip rect at [0, _w] trims
// padded content when xScale range extends beyond [0, _w].
function _renderContent() {
  // ── Viewport year range (extended by 1 for smooth edge joins) ──
  const tMinExt = Math.max(T_MIN, Math.floor(currentView.tMin) - 1);
  const tMaxExt = Math.min(T_MAX, Math.ceil(currentView.tMax) + 1);
  const idxStart = tMinExt - T_MIN;
  const idxEnd = tMaxExt - T_MIN;
  const sliceLen = idxEnd - idxStart + 1;

  // ── LOD / curve strategy (same semantics as R4) ──
  const maxPoints = 0.7 * _w;
  _denseArea = sliceLen >= _w * 0.5;

  // ── Prepare area + bridge data per family ──
  const areaData = [];     // { pathIdx, dAttr, famColor }
  const bridgeData = [];   // { famColor, segments: [{dAttr}] }

  for (let fi = 0; fi < stackOrder.length; fi++) {
    const fam = stackOrder[fi];
    const fullSeries = seriesByFamily.get(fam.name);
    let rawPoints = fullSeries.slice(idxStart, idxEnd + 1);

    if (rawPoints.length > maxPoints) {
      rawPoints = decimateSlice(rawPoints, maxPoints);
    }

    const points = rawPoints;
    if (points.length < 2) continue;

    const hasActive = points.some(d => !d.gapBridge);
    const hasBridge = points.some(d => d.gapBridge);
    if (!hasActive && !hasBridge) continue;

    // Area path generator
    const areaGen = d3.area()
      .x(d => _xScale(d.year))
      .y0(d => d.y0px)
      .y1(d => d.y1px)
      .curve(_denseArea ? d3.curveLinear : d3.curveMonotoneX);

    areaData.push({ pathIdx: fi, dAttr: areaGen(points), famColor: fam.color });

    // Collect bridge segments
    if (hasBridge) {
      const topLineGen = d3.line()
        .x(d => _xScale(d.year))
        .y(d => d.y1px)
        .curve(_denseArea ? d3.curveLinear : d3.curveMonotoneX);

      const segs = splitBridgeSegments(points, 2);
      const segD = segs.map(seg => topLineGen(seg));
      bridgeData.push({ famColor: fam.color, segD });
    }
  }

  // ── Apply area paths (guarded d-attr + display to minimize mutation records) ──
  for (const ad of areaData) {
    const pn = _areaPaths[ad.pathIdx].node();
    if (pn.__lastD !== ad.dAttr) { pn.__lastD = ad.dAttr; _areaPaths[ad.pathIdx].attr('d', ad.dAttr); }
  }
  // Hide area paths not used this frame (family not in view)
  for (let fi = 0; fi < _areaPaths.length; fi++) {
    const used = areaData.some(ad => ad.pathIdx === fi);
    const pn = _areaPaths[fi].node();
    if (pn.__lastUsed !== used) { pn.__lastUsed = used; _areaPaths[fi].style('display', used ? null : 'none'); }
  }

  // ── Apply bridge paths from pool (expand pool if needed) ──
  let bridgeNeeded = 0;
  for (const bd of bridgeData) bridgeNeeded += bd.segD.length;

  // Ensure pool has enough paths
  while (_bridgePaths.length < bridgeNeeded) {
    _bridgePaths.push(
      _bridgesG.append('path')
        .attr('fill', 'none')
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 1)
        .style('display', 'none')
    );
  }

  let bpIdx = 0;
  for (const bd of bridgeData) {
    for (const d of bd.segD) {
      const bn = _bridgePaths[bpIdx].node();
      if (bn.__lastD !== d) { bn.__lastD = d; _bridgePaths[bpIdx].attr('d', d); }
      if (bn.__lastStroke !== bd.famColor) { bn.__lastStroke = bd.famColor; _bridgePaths[bpIdx].attr('stroke', bd.famColor); }
      if (bn.__lastDisp !== 'visible') { bn.__lastDisp = 'visible'; _bridgePaths[bpIdx].style('display', null); }
      bpIdx++;
    }
  }
  // Hide unused bridge paths
  for (let i = bpIdx; i < _bridgePaths.length; i++) {
    const bn = _bridgePaths[i].node();
    if (bn.__lastDisp !== 'hidden') { bn.__lastDisp = 'hidden'; _bridgePaths[i].style('display', 'none'); }
  }

  // ── Person labels ──
  // O(1) yearRow lookup; same semantics as R4 (iron rule 4)
  const labelData = [];
  for (const fam of familyMeta) {
    for (const m of fam.members) {
      const midYear = (m.start + m.end) / 2;
      if (midYear < currentView.tMin || midYear > currentView.tMax) continue;

      const _f = Math.floor(midYear);
      const roundedYear = (midYear - _f <= 0.5) ? _f : _f + 1;
      const clampedYear = Math.max(currentView.tMin, Math.min(currentView.tMax, roundedYear));
      const bestPt = _yearGet(clampedYear);
      if (!bestPt) continue;

      const s = bestPt.stack.find(s => s.family === fam.name);
      if (!s || s.pct < 1.5) continue;

      const bandH = Math.abs(_yScale(s.y0) - _yScale(s.y1));
      if (bandH < 18) continue;

      const memberActive = s.members.some(mb => mb.name === m.name);
      if (!memberActive && bestPt.year < m.start - 3) continue;

      labelData.push({
        x: _xScale(bestPt.year), y: _yScale(s.y0 + s.pct / 2),
        name: m.name, title: m.title,
        family: fam.name, member: m,
        bandH,
      });
    }
  }

  // Greedy non-overlap filter
  const placed = [];
  for (const lbl of labelData) {
    const tooClose = placed.some(p =>
      Math.abs(p.x - lbl.x) < 48 && Math.abs(p.y - lbl.y) < 15
    );
    if (!tooClose) placed.push(lbl);
  }

  // Expand label pool if needed
  while (_labelTexts.length < placed.length) {
    const t = _labelsG.append('text')
      .attr('class', 'person-label')
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'auto')
      .style('font-size', '12px')
      .style('display', 'none');
    t.append('title');
    t.append('tspan').attr('class', 'lbl-name');
    _labelTexts.push(t);

    const s = _labelsG.append('text')
      .attr('class', 'person-label-sub')
      .attr('text-anchor', 'middle')
      .style('display', 'none');
    s.append('tspan').attr('class', 'lbl-sub');
    _labelSubTexts.push(s);
  }

  // Place labels into pool with attribute guards to minimize mutation records
  for (let i = 0; i < _labelTexts.length; i++) {
    if (i < placed.length) {
      const lbl = placed[i];
      const lnode = _labelTexts[i].node();
      const ly = lbl.y - 1;
      // Guard x/y/display to avoid unnecessary attr/style mutations (steady-state)
      if (lnode.__lastX !== lbl.x) { lnode.__lastX = lbl.x; _labelTexts[i].attr('x', lbl.x); }
      if (lnode.__lastY !== ly) { lnode.__lastY = ly; _labelTexts[i].attr('y', ly); }
      if (lnode.__lastDisp !== 'visible') { lnode.__lastDisp = 'visible'; _labelTexts[i].style('display', null); }

      if (lnode.__lastName !== lbl.name) {
        lnode.__lastName = lbl.name;
        _labelTexts[i].select('tspan.lbl-name').text(lbl.name);
        _labelTexts[i].select('title').text(lbl.name + ' · ' + lbl.title + ' · ' + lbl.family);
        // Attach member data for event delegation
        lnode.__data__ = { member: lbl.member };
      }

      if (lbl.bandH > 32) {
        const snode = _labelSubTexts[i].node();
        const sy = lbl.y + 13;
        if (snode.__lastX !== lbl.x) { snode.__lastX = lbl.x; _labelSubTexts[i].attr('x', lbl.x); }
        if (snode.__lastY !== sy) { snode.__lastY = sy; _labelSubTexts[i].attr('y', sy); }
        if (snode.__lastDisp !== 'visible') { snode.__lastDisp = 'visible'; _labelSubTexts[i].style('display', null); }
        if (snode.__lastSub !== lbl.title) {
          snode.__lastSub = lbl.title;
          _labelSubTexts[i].select('tspan.lbl-sub').text(lbl.title);
        }
      } else {
        const snode = _labelSubTexts[i].node();
        if (snode.__lastDisp !== 'hidden') { snode.__lastDisp = 'hidden'; _labelSubTexts[i].style('display', 'none'); }
      }
    } else {
      const lnode = _labelTexts[i].node();
      if (lnode.__lastDisp !== 'hidden') { lnode.__lastDisp = 'hidden'; _labelTexts[i].style('display', 'none'); }
      const snode = _labelSubTexts[i].node();
      if (snode.__lastDisp !== 'hidden') { snode.__lastDisp = 'hidden'; _labelSubTexts[i].style('display', 'none'); }
    }
  }
}

// ── renderMain() — normal (unpadded) render ──
// currentView → xScale range [0, _w]. Axes reflect currentView.
function renderMain() {
  if (!_scaffoldBuilt) buildScaffold();

  // Check if panel width changed (debounced resize usually handles this)
  const W = panelWidth();
  const newW = W - MAIN_MARGIN.left - MAIN_MARGIN.right;
  if (Math.abs(newW - _w) > 2) { buildScaffold(); }

  // ── Update x scale: currentView → [0, _w], px/year = _w / span ──
  _xScale = d3.scaleLinear().domain([currentView.tMin, currentView.tMax]).range([0, _w]);

  // ── Update axes ──
  updateAxes(currentView);

  // ── Render content ──
  _renderContent();
}

// ── _renderMainPadded(anchorView, padRatio) — padded content render ──
// Renders a wider domain so that translate scroll has buffer pixels on
// both sides without white-edge gaps. Critically: px/year = _w/span
// stays IDENTICAL to renderMain(0), so touchstart has zero visual jump.
//
// Returns: { tMin, tMax, anchorSpan } — the rendered domain + anchor span.
function _renderMainPadded(anchorView, padRatio) {
  const S = anchorView.tMax - anchorView.tMin;
  const padYrs = S * padRatio;
  let pTMin = Math.max(T_MIN, anchorView.tMin - padYrs);
  let pTMax = Math.min(T_MAX, anchorView.tMax + padYrs);

  // Actual pads after clamping (edges may be asymmetric)
  const leftPadYrs = anchorView.tMin - pTMin;
  const rightPadYrs = pTMax - anchorView.tMax;
  const leftPadPx = (leftPadYrs / S) * _w;
  const rightPadPx = (rightPadYrs / S) * _w;

  // Save/restore currentView so callers see the correct (non-padded) view
  const savedView = { tMin: currentView.tMin, tMax: currentView.tMax };
  currentView.tMin = pTMin;
  currentView.tMax = pTMax;

  // xScale: padded domain → extended pixel range; px/year = _w/S (unchanged!)
  _xScale = d3.scaleLinear()
    .domain([pTMin, pTMax])
    .range([-leftPadPx, _w + rightPadPx]);

  // Axes show the anchor view (not padded)
  updateAxes(anchorView);

  // Render content using the padded currentView + xScale
  _renderContent();

  currentView.tMin = savedView.tMin;
  currentView.tMax = savedView.tMax;

  return { tMin: pTMin, tMax: pTMax, anchorSpan: S };
}

/* ═══════════════════════════════════════════════════════════════════
   Render brush / context timeline
   ═══════════════════════════════════════════════════════════════════ */

function renderBrushStatic() {
  const W = panelWidth();
  const M = BRUSH_MARGIN;
  const w = W - M.left - M.right;
  const h = BRUSH_H - M.top - M.bottom;

  const svg = d3.select('#brush-svg')
    .attr('viewBox', `0 0 ${W} ${BRUSH_H}`)
    .style('height', BRUSH_H + 'px');
  svg.selectAll('*').remove();

  const g = svg.append('g').attr('transform',`translate(${M.left},${M.top})`);

  const xFull = d3.scaleLinear().domain([T_MIN,T_MAX]).range([0,w]);
  const yFull = d3.scaleLinear().domain([0,100.2]).range([h,0]);

  // Mini stacked areas — use seriesByFamily (no per-point find())
  const brushBridgeLines = [];
  for (const fam of stackOrder) {
    const fullSeries = seriesByFamily.get(fam.name);
    const points = [];
    for (let i = 0; i < fullSeries.length; i++) {
      const s = fullSeries[i];
      if (s.pct > 0.01 || s.gapBridge) {
        points.push({ year: s.year, y0: yFull(s.y0), y1: yFull(s.y1), pct: s.pct, gapBridge: s.gapBridge });
      }
    }

    if (points.length < 2) continue;

    const hasBridge = points.some(d => d.gapBridge);

    const areaMini = d3.area()
      .x(d => xFull(d.year)).y0(d => d.y0).y1(d => d.y1)
      .curve(d3.curveMonotoneX);

    g.append('path')
      .attr('d', areaMini(points))
      .attr('fill', fam.color)
      .attr('fill-opacity', 0.7)
      .attr('stroke', 'var(--surface-1)')
      .attr('stroke-width', 1);

    if (hasBridge) {
      brushBridgeLines.push({ family: fam, points });
    }
  }

  // Bridge lines on top
  const topLineMini = d3.line()
    .x(d => xFull(d.year))
    .y(d => d.y1)
    .curve(d3.curveMonotoneX);

  for (const bl of brushBridgeLines) {
    for (const seg of splitBridgeSegments(bl.points, 2)) {
      g.append('path')
        .attr('d', topLineMini(seg))
        .attr('fill', 'none')
        .attr('stroke', bl.family.color)
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 1);
    }
  }

  // X axis
  const xTicks = xFull.ticks(Math.max(3, Math.floor(w / 110)));
  const xAG = g.append('g')
    .attr('transform',`translate(0,${h})`)
    .call(d3.axisBottom(xFull).tickValues(xTicks)
      .tickFormat(d => d < 0 ? '前'+Math.abs(d) : String(d))
      .tickSize(0).tickPadding(6));
  xAG.selectAll('.tick text').attr('fill','var(--text-muted)').attr('font-size',11);
  xAG.select('.domain').attr('stroke','var(--baseline)').attr('stroke-width',1);

  // Brush
  const brush = d3.brushX()
    .extent([[0,0],[w,h]])
    .on('brush end', function(event) {
      if (!event.sourceEvent) return; // iron rule 2: programmatic guard
      if (!event.selection) return;
      const [x0,x1] = event.selection;
      currentView.tMin = Math.round(xFull.invert(x0));
      currentView.tMax = Math.round(xFull.invert(x1));
      clampView(currentView);
      renderMain();
    });

  const brushG = g.append('g').attr('class','brush').call(brush);

  brushG.select('.selection')
    .attr('fill','var(--slot-1)')
    .attr('fill-opacity',0.14)
    .attr('stroke','var(--slot-1)')
    .attr('stroke-width',1.5);

  brushG.selectAll('.handle')
    .attr('fill','var(--surface-1)')
    .attr('stroke','var(--slot-1)')
    .attr('stroke-width',1.5);

  // Set initial brush position
  brushG.call(brush.move, [xFull(currentView.tMin), xFull(currentView.tMax)]);

  // Cache for syncBrush
  _brushCache = { W, brush, brushG, xFull };
}

// syncBrush: only move handles (no full rebuild unless W changed)
function syncBrush() {
  if (!_brushCache || _brushCache.W !== panelWidth()) {
    renderBrushStatic();
    return;
  }
  const { brushG, brush, xFull } = _brushCache;
  brushG.call(brush.move, [xFull(currentView.tMin), xFull(currentView.tMax)]);
}

function renderBrush() { syncBrush(); }
window.renderBrushStatic = renderBrushStatic;
window.syncBrush = syncBrush;

/* ═══════════════════════════════════════════════════════════════════
   Bio modal (unchanged semantics)
   ═══════════════════════════════════════════════════════════════════ */

function showBio(member) {
  if (!member || !member.bio) return;
  document.getElementById('modal-name').textContent = member.name;
  document.getElementById('modal-family').textContent =
    member.family + ' · ' + member.title;
  document.getElementById('modal-text').textContent = member.bio;
  document.getElementById('modal-meta').innerHTML =
    '<span>活跃年代：' + (member.start < 0 ? '前' + Math.abs(member.start) : member.start) + ' — ' + (member.end < 0 ? '前' + Math.abs(member.end) : member.end) + '年</span>' +
    '<span>家族影响力：' + member.influence + '</span>';
  document.getElementById('modal-overlay').classList.add('open');
}

function hideBio() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-close').addEventListener('click', hideBio);
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) hideBio();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hideBio();
});

/* ═══════════════════════════════════════════════════════════════════
   Playback (R6: transform on move-g + updateAxes each frame)
   Iron rule 3: yrs/frame = parseFloat(speed) × 1.5, wrap semantics unchanged
   Fix-B: dirty-check wrap no-op preserved
   ═══════════════════════════════════════════════════════════════════ */

function stopPlayback() {
  isPlaying = false;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
  _pbActive = false;
  _pbPrevView = null;
  _pbWrapPending = false;
  const moveG = document.getElementById('move-g');
  if (moveG) {
    moveG.style.transform = '';
    moveG.style.willChange = '';
  }
  // Precise render at final position
  renderMain();
  syncBrush();
  document.getElementById('btn-play').classList.remove('is-active');
  document.getElementById('icon-play').style.display = null;
  document.getElementById('icon-pause').style.display = 'none';
}

function togglePlay() {
  if (isPlaying) { stopPlayback(); return; }
  isPlaying = true;
  document.getElementById('btn-play').classList.add('is-active');
  document.getElementById('icon-play').style.display = 'none';
  document.getElementById('icon-pause').style.display = null;

  // Initialize playback transform: padded render at ±100% view width
  _pbAnchorView = { tMin: currentView.tMin, tMax: currentView.tMax };
  _pbPrevTMin = currentView.tMin;
  _pbPrevTMax = currentView.tMax;
  _pbDirection = 0;
  _pbWrapPending = false;
  const padded = _renderMainPadded(_pbAnchorView, 1.0);
  _pbRenderedView = padded;
  // px/year = _w / anchorSpan — constant, same as unpadded renderMain
  _pbPxPerYear = _w / padded.anchorSpan;
  _pbActive = (padded.tMax - padded.tMin > padded.anchorSpan * 1.1); // only active if margin exists

  const moveG = document.getElementById('move-g');
  _pbMoveG = moveG;
  if (moveG && _pbActive) {
    moveG.style.willChange = 'transform';
    moveG.style.transform = 'translate3d(0,0,0)';
  }

  stepPlayback();
}

function _pbReanchor() {
  _pbAnchorView = { tMin: currentView.tMin, tMax: currentView.tMax };
  const padded = _renderMainPadded(_pbAnchorView, 1.0);
  _pbRenderedView = padded;
  _pbPxPerYear = _w / padded.anchorSpan;
  _pbActive = (padded.tMax - padded.tMin > padded.anchorSpan * 1.1);

  if (_pbMoveG) {
    if (_pbActive) {
      _pbMoveG.style.willChange = 'transform';
      _pbMoveG.style.transform = 'translate3d(0,0,0)';
    } else {
      _pbMoveG.style.willChange = '';
      _pbMoveG.style.transform = '';
    }
  }
}

function stepPlayback() {
  if (!isPlaying) return;
  const speed = parseFloat(document.getElementById('speed-select').value);
  const yrsPerFrame = speed * 1.5; // iron rule 3

  // Wrap: when at right edge, jump to start
  if (currentView.tMax >= T_MAX) {
    const winSize = currentView.tMax - currentView.tMin;
    currentView.tMin = T_MIN;
    currentView.tMax = T_MIN + winSize;
    clampView(currentView);
    // R6 Fix-B: no-op wrap (e.g. full-view playback) — view unchanged, skip all work
    if (_pbPrevTMin === currentView.tMin && _pbPrevTMax === currentView.tMax) {
      animId = requestAnimationFrame(stepPlayback);
      return;
    }
    _pbPrevTMin = currentView.tMin; _pbPrevTMax = currentView.tMax;
    // Reset transform + re-anchor at new position
    if (_pbMoveG) { _pbMoveG.style.transform = ''; _pbMoveG.style.willChange = ''; }
    _pbReanchor();
    syncBrush();
    animId = requestAnimationFrame(stepPlayback);
    return;
  }

  currentView.tMin += yrsPerFrame;
  currentView.tMax += yrsPerFrame;
  clampView(currentView);

  // ── Dirty check: skip if view identical to last frame ──
  if (_pbPrevTMin === currentView.tMin && _pbPrevTMax === currentView.tMax) {
    syncBrush();
    animId = requestAnimationFrame(stepPlayback);
    return;
  }
  _pbPrevTMin = currentView.tMin; _pbPrevTMax = currentView.tMax;

  // ── Determine scroll direction ──
  if (_pbDirection === 0) _pbDirection = (yrsPerFrame > 0 ? 1 : -1);

  // ── Transform mode ──
  if (_pbActive && _pbRenderedView) {
    if (_pbMoveG) {
      const transformDx = Math.round((_pbAnchorView.tMin - currentView.tMin) * _pbPxPerYear);
      _pbMoveG.style.transform = 'translate3d(' + transformDx + 'px,0,0)';
    }

    // Update axes to show currentView (D3 fix) — only on re-anchor for perf
    // (tick positions shift by 6yr/frame × _w/span pixels — imperceptible between re-anchors)

    // Check margin consumption (>70% → re-anchor)
    const marginRightYrs = _pbRenderedView.tMax - _pbAnchorView.tMax;
    const marginLeftYrs = _pbAnchorView.tMin - _pbRenderedView.tMin;
    const consumedRight = currentView.tMax - _pbAnchorView.tMax;
    const consumedLeft = _pbAnchorView.tMin - currentView.tMin;

    let needReanchor = false;
    if (_pbDirection > 0 && marginRightYrs > 0 && consumedRight > 0.8 * marginRightYrs) needReanchor = true;
    if (_pbDirection < 0 && marginLeftYrs > 0 && consumedLeft > 0.8 * marginLeftYrs) needReanchor = true;

    if (needReanchor) {
      if (_pbMoveG) _pbMoveG.style.transform = 'translate3d(0,0,0)';
      _pbReanchor();
      syncBrush();  // only sync brush on re-anchor
    }

    animId = requestAnimationFrame(stepPlayback);
    return;
  }

  // ── Fallback: full render when no margin available (panorama or very wide view) ──
  renderMain();
  syncBrush();
  animId = requestAnimationFrame(stepPlayback);
}

/* ═══════════════════════════════════════════════════════════════════
   Controls
   ═══════════════════════════════════════════════════════════════════ */

function shiftView(deltaYears) {
  currentView.tMin += deltaYears;
  currentView.tMax += deltaYears;
  clampView(currentView);
  renderMain();
  syncBrush();
}

function zoomView(deltaPct) {
  const center = (currentView.tMin + currentView.tMax) / 2;
  const halfSpan = (currentView.tMax - currentView.tMin) / 2;
  const newHalfSpan = Math.max(10, Math.min(300, halfSpan * deltaPct));
  currentView.tMin = Math.round(center - newHalfSpan);
  currentView.tMax = Math.round(center + newHalfSpan);
  clampView(currentView);
  renderMain();
  syncBrush();
}

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-prev').addEventListener('click', () => shiftView(-40));
document.getElementById('btn-next').addEventListener('click', () => shiftView(40));
document.getElementById('btn-zoom-in').addEventListener('click', () => zoomView(0.6));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomView(1.6));
document.getElementById('btn-reset').addEventListener('click', () => {
  stopPlayback();
  currentView = { tMin: T_MIN, tMax: T_MAX };
  clampView(currentView);
  renderMain();
  syncBrush();
});

/* ═══════════════════════════════════════════════════════════════════
   Keyboard (unchanged semantics)
   ═══════════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  const shift = e.shiftKey ? 3 : 1;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); shiftView(-30 * shift); }
  if (e.key === 'ArrowRight') { e.preventDefault(); shiftView(30 * shift); }
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePlay(); }
  if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomView(0.7); }
  if (e.key === '-') { e.preventDefault(); zoomView(1.4); }
});

/* ═══════════════════════════════════════════════════════════════════
   Touch support (R6: transform on move-g + updateAxes each frame)
   Iron rule 6: touch-action CSS / viewport meta / preventDefault preserved
   D2 fix: touchstart has ZERO visual jump — px/year constant
   D3 fix: axes always show currentView during gestures
   ═══════════════════════════════════════════════════════════════════ */

(function initTouch() {
  const chartPanel = document.getElementById('chart-panel');
  const chartSvg = document.getElementById('chart-svg');
  if (!chartSvg) return;

  let touch = {
    id: null,
    startX: 0, startY: 0,
    startTMin: 0, startTMax: 0,
    moved: false,
    // Pinch
    pinchDist0: 0,
    pinchAnchorYear: 0,
    pinchSpan0: 0,
  };

  function svgCoord(clientX, clientY) {
    const rect = chartSvg.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function _gestureReanchor() {
    _gestureAnchorView = { tMin: currentView.tMin, tMax: currentView.tMax };
    const padded = _renderMainPadded(_gestureAnchorView, 0.6);
    _gestureRenderedView = padded;
    // px/year = _w / anchorSpan — same as unpadded (D2 fix)
    _gesturePxPerYear = _w / padded.anchorSpan;
    const moveG = document.getElementById('move-g');
    if (moveG) moveG.style.transform = 'translate3d(0,0,0)';
  }

  function handleTap(clientX, clientY) {
    // 十字准线透明捕获矩形盖在标签上层，命中检测时临时穿透它
    const cap = document.querySelector('.hover-capture');
    if (cap) cap.style.pointerEvents = 'none';
    const el = document.elementFromPoint(clientX, clientY);
    if (cap) cap.style.pointerEvents = '';
    let label = el && el.closest ? el.closest('.person-label') : null;
    if (!label) {
      // 手指友好回退：24px 内最近的可见标签
      let best = null, bestD = 24;
      document.querySelectorAll('.person-label').forEach(function(l) {
        const r = l.getBoundingClientRect();
        if (!r.width) return;
        const d = Math.hypot(r.left + r.width / 2 - clientX, r.top + r.height / 2 - clientY);
        if (d < bestD) { bestD = d; best = l; }
      });
      label = best;
    }
    if (!label) return;
    const titleEl = label.querySelector('title');
    if (!titleEl) return;
    const name = titleEl.textContent.split(' · ')[0];
    const member = rawData.find(d => d.name === name);
    if (member) showBio(member);
  }
  window.handleTap = handleTap;

  chartSvg.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      const p = svgCoord(t.clientX, t.clientY);
      touch.id = t.identifier;
      touch.startX = p.x;
      touch.startY = p.y;
      touch.startTMin = currentView.tMin;
      touch.startTMax = currentView.tMax;
      touch.moved = false;

      // Begin transform gesture: padded render ±60%
      // D2 fix: _renderMainPadded keeps px/year = _w/span unchanged
      // → zero visual jump at touchstart (labels stay pixel-identical)
      _gestureActive = true;
      _gestureAnchorView = { tMin: currentView.tMin, tMax: currentView.tMax };
      const padded = _renderMainPadded(_gestureAnchorView, 0.6);
      _gestureRenderedView = padded;
      _gesturePxPerYear = _w / padded.anchorSpan;

      const moveG = document.getElementById('move-g');
      if (moveG) {
        moveG.style.willChange = 'transform';
        moveG.style.transform = 'translate3d(0,0,0)';
      }

    } else if (e.touches.length === 2) {
      e.preventDefault();
      const p0 = svgCoord(e.touches[0].clientX, e.touches[0].clientY);
      const p1 = svgCoord(e.touches[1].clientX, e.touches[1].clientY);
      touch.pinchDist0 = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const midSvgX = (p0.x + p1.x) / 2;
      touch.pinchAnchorYear = svgXtoYear(midSvgX);
      touch.pinchSpan0 = currentView.tMax - currentView.tMin;
      touch.moved = true;

      // If not already in gesture mode, init it
      if (!_gestureActive) {
        _gestureActive = true;
        _gestureAnchorView = { tMin: currentView.tMin, tMax: currentView.tMax };
        const padded = _renderMainPadded(_gestureAnchorView, 0.6);
        _gestureRenderedView = padded;
        _gesturePxPerYear = _w / padded.anchorSpan;

        const moveG = document.getElementById('move-g');
        if (moveG) {
          moveG.style.willChange = 'transform';
          moveG.style.transform = 'translate3d(0,0,0)';
        }
      }

      // Track pinch anchor for scale calculation
      _gesturePinchSpan0 = touch.pinchSpan0;
      _gesturePinchAnchorYear = touch.pinchAnchorYear;
    }
  }, { passive: false });

  function svgXtoYear(svgX) {
    const M = MAIN_MARGIN;
    const w = panelWidth() - M.left - M.right;
    if (_xScale) return _xScale.invert(svgX - M.left);
    const xScale = d3.scaleLinear().domain([currentView.tMin, currentView.tMax]).range([0, w]);
    return xScale.invert(svgX - M.left);
  }

  chartSvg.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && _gestureActive) {
      const t = e.touches[0];
      if (t.identifier !== touch.id) return;
      const p = svgCoord(t.clientX, t.clientY);
      const dx = p.x - touch.startX;
      const dy = p.y - touch.startY;
      const dist = Math.hypot(dx, dy);
      if (dist > 6) {
        touch.moved = true;
        e.preventDefault();

        // Update currentView from pixel delta
        const dyears = dx / _gesturePxPerYear;
        currentView.tMin = touch.startTMin - dyears;
        currentView.tMax = touch.startTMax - dyears;
        clampView(currentView);

        // D1 fix: CSS transform on move-g only (axes stay fixed)
        const transformDx = (_gestureAnchorView.tMin - currentView.tMin) * _gesturePxPerYear;
        const moveG = document.getElementById('move-g');
        if (moveG) moveG.style.transform = 'translate3d(' + transformDx + 'px,0,0)';

        // D3 fix: update axes to show currentView
        updateAxes(currentView);

        syncBrush();

        // Re-anchor if margin exceeded (>45% of viewport width)
        if (Math.abs(transformDx) > 0.45 * _w) {
          _gestureReanchor();
        }
      }
    } else if (e.touches.length === 2 && _gestureActive) {
      e.preventDefault();
      touch.moved = true;
      const p0 = svgCoord(e.touches[0].clientX, e.touches[0].clientY);
      const p1 = svgCoord(e.touches[1].clientX, e.touches[1].clientY);
      const newDist = Math.hypot(p1.x - p0.x, p1.y - p0.y);

      if (touch.pinchDist0 > 0 && newDist > 0) {
        // Update currentView span (same logic as R4)
        const scale = touch.pinchDist0 / Math.max(1, newDist);
        const newSpan = Math.max(8, Math.min(500, touch.pinchSpan0 * scale));
        const half = newSpan / 2;
        currentView.tMin = Math.round(touch.pinchAnchorYear - half);
        currentView.tMax = Math.round(touch.pinchAnchorYear + half);
        clampView(currentView);

        // R6 pinch: scale+translate on move-g with origin in content coords
        const renderedSpan = _gestureRenderedView.tMax - _gestureRenderedView.tMin;
        const k = renderedSpan / (currentView.tMax - currentView.tMin);
        const panDx = (_gestureAnchorView.tMin - currentView.tMin) * _gesturePxPerYear;

        // Midpoint in move-g content coordinates (subtract M.left for content space)
        const midContentX = (p0.x + p1.x) / 2 - MAIN_MARGIN.left;

        // Combined transform: translate keeps pinch center fixed under scale
        const totalTx = panDx + midContentX * (1 - k);

        const moveG = document.getElementById('move-g');
        if (moveG) {
          moveG.style.transformOrigin = '0 0';
          // Horizontal-only zoom: scaleX stretches time axis, scaleY stays 1 (no vertical distortion)
          moveG.style.transform = 'translate3d(' + totalTx + 'px,0,0) scale(' + k + ',1)';
        }

        // D3 fix: update axes to show currentView
        updateAxes(currentView);

        syncBrush();

        // Re-anchor if scale diverges too much
        if (k < 0.4 || k > 2.5) {
          _gestureReanchor();
        }
      }
    }
  }, { passive: false });

  chartSvg.addEventListener('touchend', function(e) {
    // End transform mode
    if (_gestureActive) {
      _gestureActive = false;
      const moveG = document.getElementById('move-g');
      if (moveG) {
        moveG.style.transform = '';
        moveG.style.willChange = '';
        moveG.style.transformOrigin = '';
      }
      // Precise render at final position
      renderMain();
    }

    // Tap detection (displacement < 8px)
    if (!touch.moved && e.changedTouches.length === 1) {
      const t = e.changedTouches[0];
      const p = svgCoord(t.clientX, t.clientY);
      const dist = Math.hypot(p.x - touch.startX, p.y - touch.startY);
      if (dist < 8) {
        handleTap(t.clientX, t.clientY);
      }
    }

    // Reset state
    touch.id = null;
    touch.moved = false;
    touch.pinchDist0 = 0;
    _gesturePinchSpan0 = 0;
    _gesturePinchAnchorYear = 0;
  });
})();
