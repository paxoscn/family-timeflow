// Shared helper: split points into contiguous gapBridge segments.
// Only returns gap=true intervals, each extended into neighbours
// for seamless joins – prevents full-width edge artifacts.
function splitBridgeSegments(pts, extendN) {
  if (pts.length === 0) return [];
  const segs = [];
  let cur = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].gapBridge === pts[i - 1].gapBridge) {
      cur.push(pts[i]);
    } else {
      segs.push(cur);
      cur = [pts[i]];
    }
  }
  segs.push(cur);
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    if (!segs[i][0].gapBridge) continue;
    const ext = [...segs[i]];
    if (i > 0) ext.unshift(...segs[i - 1].slice(-extendN));
    if (i < segs.length - 1) ext.push(...segs[i + 1].slice(0, extendN));
    out.push(ext);
  }
  return out;
}

function renderMain() {
  const W = panelWidth();
  const M = MAIN_MARGIN;
  const w = W - M.left - M.right;
  const h = MAIN_H - M.top - M.bottom;
  const totalW = W;
  const totalH = MAIN_H;

  const svg = d3.select('#chart-svg')
    .attr('viewBox', `0 0 ${totalW} ${totalH}`)
    .style('height', totalH + 'px');
  svg.selectAll('*').remove();

  const g = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

  // Clip path
  g.append('defs').append('clipPath').attr('id','main-clip')
    .append('rect').attr('x',0).attr('y',-6).attr('width',w).attr('height',h+12);

  // Scales
  const x = d3.scaleLinear()
    .domain([currentView.tMin, currentView.tMax]).range([0, w]);
  const y = d3.scaleLinear()
    .domain([0, 100.2]).range([h, 0]);

  // ── Gridlines ──
  const yTicks = y.ticks(5);
  g.append('g').attr('class','grid').selectAll('line')
    .data(yTicks).join('line')
    .attr('x1',0).attr('x2',w)
    .attr('y1',d=>y(d)).attr('y2',d=>y(d))
    .attr('stroke','var(--gridline)').attr('stroke-width',1);

  // ── Y axis ──
  const yAxisG = g.append('g').call(
    d3.axisLeft(y).tickValues(yTicks).tickFormat(d=>d+'%').tickSize(0).tickPadding(8)
  );
  yAxisG.selectAll('.tick text')
    .attr('fill','var(--text-muted)').attr('font-size',12);
  yAxisG.select('.domain').remove();

  // ── X axis ──
  const xTicks = x.ticks(Math.max(4, Math.floor(w / 90)));
  const xAxisG = g.append('g')
    .attr('transform',`translate(0,${h})`)
    .call(
      d3.axisBottom(x).tickValues(xTicks)
        .tickFormat(d => d < 0 ? '前'+Math.abs(d) : String(d))
        .tickSize(0).tickPadding(8)
    );
  xAxisG.selectAll('.tick text')
    .attr('fill','var(--text-muted)').attr('font-size',12);
  xAxisG.select('.domain')
    .attr('stroke','var(--baseline)').attr('stroke-width',1);

  // ── Baseline at y=0 ──
  g.append('line')
    .attr('x1',0).attr('x2',w).attr('y1',h).attr('y2',h)
    .attr('stroke','var(--baseline)').attr('stroke-width',1);

  // ── Filter data to view ──
  const visible = stackedData.filter(d =>
    d.year >= Math.floor(currentView.tMin) - 1 &&
    d.year <= Math.ceil(currentView.tMax) + 1
  );

  // ── Stacked areas ──
  const clipG = g.append('g').attr('clip-path','url(#main-clip)');

  // Bridge-line data collected during the area pass and drawn last
  // so they sit on top of all family fills and white gap strokes.
  const bridgeLines = [];

  // For each family, draw its band from y0 to y1.
  // Lifecycle gaps get hairline bridges: the area collapses to a sliver
  // so the family still occupies its stack position during internal gaps.
  for (const fam of stackOrder) {
    // Collect all points — including gap-bridge hairline points
    const points = visible.map(d => {
      const s = d.stack.find(s => s.family === fam.name);
      return s ? { year: d.year, y0: y(s.y0), y1: y(s.y1), pct: s.pct, gapBridge: s.gapBridge } : null;
    }).filter(Boolean);

    if (points.length < 2) continue;

    const hasActive = points.some(d => !d.gapBridge);
    const hasBridge = points.some(d => d.gapBridge);
    if (!hasActive && !hasBridge) continue;

    // ---- filled area (active segments, hairline-collapsed gaps) ----
    const areaGen = d3.area()
      .x(d => x(d.year))
      .y0(d => d.y0)
      .y1(d => d.y1)
      .curve(d3.curveMonotoneX);

    clipG.append('path')
      .attr('d', areaGen(points))
      .attr('fill', fam.color)
      .attr('fill-opacity', 0.82)
      .attr('stroke', 'var(--surface-1)')
      .attr('stroke-width', 2);

    // Collect bridge-line data for second pass (drawn on top of all areas)
    if (hasBridge) {
      bridgeLines.push({ family: fam, points });
    }
  }

  // ---- Bridge lines: drawn LAST, on top of all areas ----
  // Solid, fully opaque, ≥2 px family-coloured strokes so the
  // connection across lifecycle gaps is unmistakably visible.
  // Uses shared splitBridgeSegments() to only draw gap intervals
  // (extended into neighbours), preventing full-width edge artifacts.
  const topLineGen = d3.line()
    .x(d => x(d.year))
    .y(d => d.y1)
    .curve(d3.curveMonotoneX);

  for (const bl of bridgeLines) {
    for (const seg of splitBridgeSegments(bl.points, 2)) {
      clipG.append('path')
        .attr('d', topLineGen(seg))
        .attr('fill', 'none')
        .attr('stroke', bl.family.color)
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 1);
    }
  }

  // ── Person labels ──
  const labelData = [];
  for (const fam of familyMeta) {
    for (const m of fam.members) {
      const midYear = (m.start + m.end) / 2;
      if (midYear < currentView.tMin || midYear > currentView.tMax) continue;

      // Find the stacked data point nearest to this member's midpoint
      let bestPt = null, bestDist = Infinity;
      for (const d of visible) {
        const dist = Math.abs(d.year - midYear);
        if (dist < bestDist) { bestDist = dist; bestPt = d; }
      }
      if (!bestPt) continue;

      const s = bestPt.stack.find(s => s.family === fam.name);
      if (!s || s.pct < 1.5) continue;

      const yBand = y(s.y0 + s.pct / 2);
      const xPos = x(bestPt.year);

      // Only place if band height in pixels is enough
      const bandH = Math.abs(y(s.y0) - y(s.y1));
      if (bandH < 18) continue;

      // Check if this member is actually active at this year
      const memberActive = s.members.some(mb => mb.name === m.name);
      if (!memberActive && bestPt.year < m.start - 3) continue;

      labelData.push({
        x: xPos, y: yBand,
        name: m.name, title: m.title,
        family: fam.name, member: m,
        bandH,
      });
    }
  }

  // Greedy non-overlap filter
  const placed = [];
  for (const lbl of labelData) {
    const tooClose = placed.some(p =>
      Math.abs(p.x - lbl.x) < 48 && Math.abs(p.y - lbl.y) < 15
    );
    if (!tooClose) placed.push(lbl);
  }

  // Render labels
  for (const lbl of placed) {
    const maxWidth = Math.min(lbl.bandH * 2.2, 90);
    clipG.append('text')
      .attr('class','person-label')
      .attr('x', lbl.x).attr('y', lbl.y - 1)
      .attr('text-anchor','middle')
      .attr('dominant-baseline','auto')
      .style('font-size','12px')
      .text(lbl.name)
      .on('click', (event) => { event.stopPropagation(); showBio(lbl.member); })
      .append('title')
      .text(lbl.name + ' · ' + lbl.title + ' · ' + lbl.family);

    // Subtitle: title
    if (lbl.bandH > 32) {
      clipG.append('text')
        .attr('class','person-label-sub')
        .attr('x', lbl.x).attr('y', lbl.y + 13)
        .attr('text-anchor','middle')
        .text(lbl.title);
    }
  }

  // ── Crosshair + hover ──
  const crossLine = g.append('line')
    .attr('y1',0).attr('y2',h)
    .attr('stroke','var(--text-muted)')
    .attr('stroke-width',1)
    .style('display','none');

  const tooltip = d3.select('#tooltip');

  g.append('rect')
    .attr('width',w).attr('height',h)
    .attr('fill','transparent')
    .on('mousemove', function(event) {
      const [mx] = d3.pointer(event);
      const year = Math.round(x.invert(mx));
      const cy = Math.max(currentView.tMin, Math.min(currentView.tMax, year));

      crossLine.attr('x1',x(cy)).attr('x2',x(cy)).style('display',null);

      const pt = stackedData.find(d => d.year === cy);
      if (!pt) { tooltip.style('display','none'); return; }

      let html = `<div class="tt-date">${cy < 0 ? '前' + Math.abs(cy) + '年' : cy + '年'}</div>`;
      const sorted = [...pt.stack]
        .filter(s => s.pct > 0.1)
        .sort((a,b) => b.pct - a.pct);
      for (const s of sorted) {
        const fam = famMap[s.family];
        html += `<div class="tt-row">`;
        html += `<span class="tt-swatch" style="background:${fam.color}"></span>`;
        html += `<span class="tt-name">${s.family}</span>`;
        html += `<span class="tt-pct">${s.pct.toFixed(1)}%</span>`;
        html += `</div>`;
        if (s.members.length > 0) {
          const memStr = s.members.map(m => m.name + '（' + m.title + '）').join('、');
          html += `<div class="tt-members">${memStr}</div>`;
        }
      }
      tooltip.html(html);

      // tooltip is positioned absolutely within chart-panel
      const panelW = document.getElementById('chart-panel').clientWidth;
      let tx = M.left + x(cy) + 14;
      if (tx + 190 > panelW) tx = M.left + x(cy) - 200;
      tooltip
        .style('left', tx + 'px')
        .style('top', (M.top + 8) + 'px')
        .style('display', null);
    })
    .on('mouseleave', () => {
      crossLine.style('display','none');
      tooltip.style('display','none');
    });

  // ── Legend ──
  const legendRow = document.getElementById('legend-row');
  legendRow.innerHTML = familyMeta.map(f =>
    `<span class="legend-item"><span class="legend-swatch" style="background:${f.color}"></span>${f.name}</span>`
  ).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   Render brush / context timeline
   ═══════════════════════════════════════════════════════════════════ */

function renderBrush() {
  const W = panelWidth();
  const M = BRUSH_MARGIN;
  const w = W - M.left - M.right;
  const h = BRUSH_H - M.top - M.bottom;

  const svg = d3.select('#brush-svg')
    .attr('viewBox', `0 0 ${W} ${BRUSH_H}`)
    .style('height', BRUSH_H + 'px');
  svg.selectAll('*').remove();

  const g = svg.append('g').attr('transform',`translate(${M.left},${M.top})`);

  const xFull = d3.scaleLinear().domain([T_MIN,T_MAX]).range([0,w]);
  const yFull = d3.scaleLinear().domain([0,100.2]).range([h,0]);

  // Mini stacked areas — use precomputed stackedData (includes gap bridges)
  const brushBridgeLines = [];
  for (const fam of stackOrder) {
    const points = stackedData.map(d => {
      const s = d.stack.find(s => s.family === fam.name);
      return s ? { year: d.year, y0: yFull(s.y0), y1: yFull(s.y1), pct: s.pct, gapBridge: s.gapBridge } : null;
    }).filter(d => d && (d.pct > 0.01 || d.gapBridge));

    if (points.length < 2) continue;

    const hasBridge = points.some(d => d.gapBridge);

    const areaMini = d3.area()
      .x(d => xFull(d.year)).y0(d => d.y0).y1(d => d.y1)
      .curve(d3.curveMonotoneX);

    g.append('path')
      .attr('d', areaMini(points))
      .attr('fill', fam.color)
      .attr('fill-opacity', 0.7)
      .attr('stroke', 'var(--surface-1)')
      .attr('stroke-width', 1);

    if (hasBridge) {
      brushBridgeLines.push({ family: fam, points });
    }
  }

  // Bridge lines on top (same as main chart)
  const topLineMini = d3.line()
    .x(d => xFull(d.year))
    .y(d => d.y1)
    .curve(d3.curveMonotoneX);

  for (const bl of brushBridgeLines) {
    for (const seg of splitBridgeSegments(bl.points, 2)) {
      g.append('path')
        .attr('d', topLineMini(seg))
        .attr('fill', 'none')
        .attr('stroke', bl.family.color)
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 1);
    }
  }

  // X axis
  const xTicks = xFull.ticks(Math.max(3, Math.floor(w / 110)));
  const xAG = g.append('g')
    .attr('transform',`translate(0,${h})`)
    .call(d3.axisBottom(xFull).tickValues(xTicks)
      .tickFormat(d => d < 0 ? '前'+Math.abs(d) : String(d))
      .tickSize(0).tickPadding(6));
  xAG.selectAll('.tick text').attr('fill','var(--text-muted)').attr('font-size',11);
  xAG.select('.domain').attr('stroke','var(--baseline)').attr('stroke-width',1);

  // Brush
  const brush = d3.brushX()
    .extent([[0,0],[w,h]])
    .on('brush end', function(event) {
      if (!event.selection) return;
      const [x0,x1] = event.selection;
      currentView.tMin = Math.round(xFull.invert(x0));
      currentView.tMax = Math.round(xFull.invert(x1));
      if (currentView.tMax - currentView.tMin < 4) {
        currentView.tMax = currentView.tMin + 4;
      }
      renderMain();
    });

  const brushG = g.append('g').attr('class','brush').call(brush);

  brushG.select('.selection')
    .attr('fill','var(--slot-1)')
    .attr('fill-opacity',0.14)
    .attr('stroke','var(--slot-1)')
    .attr('stroke-width',1.5);

  brushG.selectAll('.handle')
    .attr('fill','var(--surface-1)')
    .attr('stroke','var(--slot-1)')
    .attr('stroke-width',1.5);

  // Set initial brush
  brushG.call(brush.move, [xFull(currentView.tMin), xFull(currentView.tMax)]);
}

/* ═══════════════════════════════════════════════════════════════════
   Bio modal
   ═══════════════════════════════════════════════════════════════════ */

function showBio(member) {
  if (!member || !member.bio) return;
  document.getElementById('modal-name').textContent = member.name;
  document.getElementById('modal-family').textContent =
    member.family + ' · ' + member.title;
  document.getElementById('modal-text').textContent = member.bio;
  document.getElementById('modal-meta').innerHTML =
    `<span>活跃年代：${member.start < 0 ? '前' + Math.abs(member.start) : member.start} — ${member.end < 0 ? '前' + Math.abs(member.end) : member.end}年</span>` +
    `<span>家族影响力：${member.influence}</span>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function hideBio() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-close').addEventListener('click', hideBio);
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) hideBio();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') hideBio();
});

/* ═══════════════════════════════════════════════════════════════════
   Playback
   ═══════════════════════════════════════════════════════════════════ */

function stopPlayback() {
  isPlaying = false;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
  document.getElementById('btn-play').classList.remove('is-active');
  document.getElementById('icon-play').style.display = null;
  document.getElementById('icon-pause').style.display = 'none';
}

function togglePlay() {
  if (isPlaying) { stopPlayback(); return; }
  isPlaying = true;
  document.getElementById('btn-play').classList.add('is-active');
  document.getElementById('icon-play').style.display = 'none';
  document.getElementById('icon-pause').style.display = null;
  stepPlayback();
}

function stepPlayback() {
  if (!isPlaying) return;
  const speed = parseFloat(document.getElementById('speed-select').value);
  const yrsPerFrame = speed * 1.5;
  const winSize = currentView.tMax - currentView.tMin;

  currentView.tMin += yrsPerFrame;
  currentView.tMax += yrsPerFrame;

  if (currentView.tMin >= T_MAX) {
    currentView.tMin = T_MIN;
    currentView.tMax = T_MIN + winSize;
  }
  if (currentView.tMax > T_MAX) {
    currentView.tMax = T_MAX;
    currentView.tMin = T_MAX - winSize;
  }
  currentView.tMin = Math.max(T_MIN, currentView.tMin);

  renderMain();
  renderBrush();
  animId = requestAnimationFrame(stepPlayback);
}

/* ═══════════════════════════════════════════════════════════════════
   Controls
   ═══════════════════════════════════════════════════════════════════ */

function shiftView(deltaYears) {
  const winSize = currentView.tMax - currentView.tMin;
  currentView.tMin = Math.max(T_MIN, currentView.tMin + deltaYears);
  currentView.tMax = Math.min(T_MAX, currentView.tMax + deltaYears);
  if (currentView.tMax <= currentView.tMin + 4) {
    if (deltaYears > 0) currentView.tMax = currentView.tMin + 4;
    else currentView.tMin = currentView.tMax - 4;
  }
  renderMain();
  renderBrush();
}

function zoomView(deltaPct) {
  const center = (currentView.tMin + currentView.tMax) / 2;
  const halfSpan = (currentView.tMax - currentView.tMin) / 2;
  const newHalfSpan = Math.max(10, Math.min(300, halfSpan * deltaPct));
  currentView.tMin = Math.max(T_MIN, Math.round(center - newHalfSpan));
  currentView.tMax = Math.min(T_MAX, Math.round(center + newHalfSpan));
  if (currentView.tMax - currentView.tMin < 4) {
    currentView.tMax = currentView.tMin + 4;
  }
  renderMain();
  renderBrush();
}

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-prev').addEventListener('click', () => shiftView(-40));
document.getElementById('btn-next').addEventListener('click', () => shiftView(40));
document.getElementById('btn-zoom-in').addEventListener('click', () => zoomView(0.6));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomView(1.6));
document.getElementById('btn-reset').addEventListener('click', () => {
  stopPlayback();
  currentView = { tMin: T_MIN, tMax: T_MAX };
  renderMain();
  renderBrush();
});

/* ═══════════════════════════════════════════════════════════════════
   Keyboard
   ═══════════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  const shift = e.shiftKey ? 3 : 1;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); shiftView(-30 * shift); }
  if (e.key === 'ArrowRight') { e.preventDefault(); shiftView(30 * shift); }
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePlay(); }
  if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomView(0.7); }
  if (e.key === '-') { e.preventDefault(); zoomView(1.4); }
});

/* ═══════════════════════════════════════════════════════════════════
   Table view (accessibility)
   ═══════════════════════════════════════════════════════════════════ */

function renderTable() {
  const thead = document.querySelector('#data-table thead');
  const tbody = document.querySelector('#data-table tbody');
  thead.innerHTML = '';
  tbody.innerHTML = '';

  let hh = '<tr><th>年份</th>';
  for (const fam of familyMeta) {
    hh += `<th><span class="td-swatch" style="background:${fam.color}"></span>${fam.name}</th>`;
  }
  hh += '</tr>';
  thead.innerHTML = hh;

  const span = currentView.tMax - currentView.tMin;
      const step = span > 300 ? Math.max(10, Math.floor(span / 200)) : Math.max(1, Math.floor(span / 30));
  for (let y = currentView.tMin; y <= currentView.tMax; y += step) {
    const pt = stackedData.find(d => d.year === Math.round(y));
    if (!pt) continue;
    let row = `<tr><td>${y < 0 ? '前' + Math.abs(Math.round(y)) + '年' : Math.round(y) + '年'}</td>`;
    for (const fam of familyMeta) {
      const s = pt.stack.find(s => s.family === fam.name);
      row += `<td>${s && s.pct > 0.05 ? s.pct.toFixed(1) + '%' : '—'}</td>`;
    }
    row += '</tr>';
    tbody.innerHTML += row;
  }
}

document.getElementById('btn-table').addEventListener('click', function() {
  const wrap = document.getElementById('table-wrap');
  const visible = wrap.classList.toggle('visible');
  this.textContent = visible ? '📋 隐藏数据表' : '📋 数据表';
  if (visible) renderTable();
});

/* ═══════════════════════════════════════════════════════════════════
   Init + resize
   ═══════════════════════════════════════════════════════════════════ */

renderMain();
renderBrush();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderMain(); renderBrush(); }, 200);
});
</script>
