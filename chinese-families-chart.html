function renderTable() {
  const thead = document.querySelector('#data-table thead');
  const tbody = document.querySelector('#data-table tbody');
  thead.innerHTML = '';
  tbody.innerHTML = '';

  let hh = '<tr><th>年份</th>';
  for (const fam of familyMeta) {
    hh += '<th><span class="td-swatch" style="background:' + fam.color + '"></span>' + fam.name + '</th>';
  }
  hh += '</tr>';
  thead.innerHTML = hh;

  const span = currentView.tMax - currentView.tMin;
  const step = span > 300 ? Math.max(10, Math.floor(span / 200)) : Math.max(1, Math.floor(span / 30));
  for (let y = currentView.tMin; y <= currentView.tMax; y += step) {
    const pt = _yearGet(Math.round(y));
    if (!pt) continue;
    let row = '<tr><td>' + (y < 0 ? '前' + Math.abs(Math.round(y)) + '年' : Math.round(y) + '年') + '</td>';
    for (const fam of familyMeta) {
      const s = pt.stack.find(s => s.family === fam.name);
      row += '<td>' + (s && s.pct > 0.05 ? s.pct.toFixed(1) + '%' : '—') + '</td>';
    }
    row += '</tr>';
    tbody.innerHTML += row;
  }
}

document.getElementById('btn-table').addEventListener('click', function() {
  const wrap = document.getElementById('table-wrap');
  const visible = wrap.classList.toggle('visible');
  this.textContent = visible ? '📋 隐藏数据表' : '📋 数据表';
  if (visible) renderTable();
});

/* ═══════════════════════════════════════════════════════════════════
   Init + resize (R5: buildScaffold on init, debounced rebuild on resize)
   ═══════════════════════════════════════════════════════════════════ */

// Initial render
buildScaffold();
renderMain();
renderBrushStatic();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    buildScaffold();
    renderMain();
    renderBrushStatic();
  }, 200);
});


// ============ SELF-CHECK HARNESS for R5 ============
console.log("=== R5 Self-Check ===");

// (a) MutationObserver — steady-state renderMain
function checkMutations() {
  return new Promise(resolve => {
    const target = document.getElementById('chart-svg');
    let added = 0, removed = 0, attrs = 0;
    const obs = new MutationObserver(records => {
      records.forEach(r => {
        added += r.addedNodes.length;
        removed += r.removedNodes.length;
        if (r.type === 'attributes') attrs++;
      });
    });
    obs.observe(target, { childList: true, subtree: true, attributes: true });
    // Take records to flush any pending
    obs.takeRecords();
    // Trigger renderMain
    renderMain();
    const records = obs.takeRecords();
    records.forEach(r => {
      added += r.addedNodes.length;
      removed += r.removedNodes.length;
      if (r.type === 'attributes') attrs++;
    });
    obs.disconnect();
    resolve({ added, removed, attrs });
  });
}

// (b) Performance test
async function perfTest() {
  // Warm up
  renderMain();
  
  // Measure renderMain
  const start = performance.now();
  renderMain();
  const elapsed = performance.now() - start;
  console.log("renderMain (steady-state):", elapsed.toFixed(1), "ms");
  
  // Playback 4x for 1.6s
  const frames = [];
  let frameStart = performance.now();
  const origRAF = window.requestAnimationFrame;
  let rafCount = 0;
  
  return new Promise(resolve => {
    const speed = document.getElementById('speed-select');
    const origSpeed = speed.value;
    speed.value = '4';
    currentView = { tMin: T_MIN, tMax: T_MAX };
    renderMain();
    syncBrush();
    togglePlay();
    
    const startTime = performance.now();
    const endTime = startTime + 1600;
    
    function measureFrame(ts) {
      rafCount++;
      if (rafCount > 1) {
        frames.push(ts - (frames.length > 0 ? frames[frames.length-1] : startTime));
      }
      if (performance.now() < endTime) {
        requestAnimationFrame(measureFrame);
      } else {
        stopPlayback();
        speed.value = origSpeed;
        
        // Compute stats
        if (frames.length > 0) {
          const sorted = [...frames].sort((a,b)=>a-b);
          const median = sorted[Math.floor(sorted.length/2)];
          const p95 = sorted[Math.floor(sorted.length*0.95)];
          const fps = 1000 / median;
          console.log("4x playback 1.6s:", {
            frames: frames.length,
            median: median.toFixed(1) + "ms",
            p95: p95.toFixed(1) + "ms", 
            fps: fps.toFixed(1)
          });
        }
        resolve();
      }
    }
    requestAnimationFrame(measureFrame);
  });
}

// (c) Five-speed single-frame check
function checkSpeeds() {
  const speeds = [0.25, 0.5, 1, 2, 4];
  const expected = [0.375, 0.75, 1.5, 3, 6];
  const results = [];
  for (const s of speeds) {
    results.push(s * 1.5);
  }
  console.log("Speed check:", results);
  const match = results.every((v, i) => Math.abs(v - expected[i]) < 0.001);
  console.log("Speed values correct:", match);
  return match;
}

// (d) Regression tests
function checkLabels() {
  currentView = { tMin: T_MIN, tMax: T_MAX };
  renderMain();
  
  // Count visible labels
  const labels = document.querySelectorAll('.person-label:not([style*="display: none"])');
  console.log("Visible labels:", labels.length);
  
  // Check for key names
  const names = Array.from(labels).map(l => l.textContent);
  const hasZiying = names.includes('子婴');
  const hasLidan = names.includes('李旦');
  console.log("子婴 present:", hasZiying);
  console.log("李旦 present:", hasLidan);
  return hasZiying && hasLidan;
}

// (e) Data integrity
function checkData() {
  console.log("rawData length:", rawData.length, "== 381:", rawData.length === 381);
  console.log("families length:", families.length, "== 64:", families.length === 64);
  console.log("SLOTS length:", SLOTS.length, "== 65:", SLOTS.length === 65);
  return rawData.length === 381 && families.length === 64 && SLOTS.length === 65;
}

// Run all checks
async function runAllChecks() {
  console.log("Running self-checks...");
  
  // (e) Data integrity (sync)
  const e = checkData();
  
  // (c) Speed (sync)
  const c = checkSpeeds();
  
  // (d) Labels (sync)
  const d = checkLabels();
  
  // (a) Mutations (async)
  const a = await checkMutations();
  console.log("MutationObserver:", a, "Goal: added=0 removed=0");
  
  // (b) Performance (async)
  await perfTest();
  
  console.log("=== Checks complete ===");
  console.log("Data:", e ? "PASS" : "FAIL");
  console.log("Speeds:", c ? "PASS" : "FAIL");
  console.log("Labels:", d ? "PASS" : "FAIL");
  console.log("Mutations:", (a.added===0 && a.removed===0) ? "PASS" : "FAIL (added="+a.added+" removed="+a.removed+")");
}

// Expose for console use
window.runAllChecks = runAllChecks;
window.checkMutations = checkMutations;
window.perfTest = perfTest;
window.checkSpeeds = checkSpeeds;
window.checkData = checkData;
window.checkLabels = checkLabels;
console.log("Self-check harness loaded. Run runAllChecks() to execute.");

</script>
